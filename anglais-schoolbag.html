<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What's in your schoolbag?</title>
<meta name="theme-color" content="#2563eb">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
<style>
/* ====== Couleur de la matière : seule ligne à changer d'une matière à l'autre ====== */
:root{ --matiere:#2563eb; --matiere-encre:#ffffff; --matiere-fort:#1d4ed8; }

/* ====== Style commun « Mes révisions » (identique dans tous les exercices) ====== */
:root{
  --papier:#fbfcfe; --carte:#fff; --encre:#1f2a44; --encre-douce:#55607a; --trait:#dde3ee; --marge:#f1a7a7;
  --juste:#15803d; --juste-voile:#dcfce7; --faux:#b42318; --faux-voile:#fee4e2; --orange:#b45309; --orange-voile:#fef3c7;
  --titre:"Fredoka","Trebuchet MS",sans-serif; --texte:"Atkinson Hyperlegible",Verdana,sans-serif; --rayon:14px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--papier);color:var(--encre);font:18px/1.5 var(--texte)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--matiere-fort);outline-offset:2px}
.cache{display:none!important}
.couverture{background:var(--matiere);color:var(--matiere-encre);padding:12px 16px 26px;border-bottom:4px solid var(--matiere-fort)}
.barre-haut{display:flex;justify-content:space-between;max-width:640px;margin:0 auto 14px;font-size:15px}
.barre-haut a,.barre-haut button{color:inherit;text-decoration:none;background:none;border:0;padding:6px 0;font-weight:700}
.etiquette{max-width:640px;margin:0 auto;background:#fff;color:var(--encre);border-radius:10px;padding:14px 18px 16px;box-shadow:0 2px 0 rgba(31,42,68,.18)}
.etiquette p{margin:0 0 2px;font-size:15px;color:var(--encre-douce)}
.etiquette h1{font:600 28px/1.15 var(--titre);margin:0}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px 28px;position:relative}
main::before{content:"";position:absolute;top:0;bottom:0;left:14px;width:2px;background:var(--marge);opacity:.7}
h2{font:600 23px var(--titre);margin:8px 0 12px}
h3{font:600 20px var(--titre);margin:18px 0 6px}
p{margin:0 0 10px}
.doux{color:var(--encre-douce)}
.btn{display:block;width:100%;text-align:left;background:var(--carte);border:2px solid var(--trait);border-radius:var(--rayon);padding:14px 16px;margin:0 0 10px;font-weight:700}
.btn small{display:block;font-weight:400;color:var(--encre-douce);font-size:15px}
.btn.plein{background:var(--matiere);color:var(--matiere-encre);border-color:var(--matiere-fort)}
.btn.plein small{color:inherit;opacity:.85}
.btn.centre{text-align:center}
.rangee{display:flex;gap:10px}
.bilan{border:2px solid var(--trait);border-radius:var(--rayon);padding:12px 16px;margin:0 0 16px;background:var(--carte)}
.bilan p{margin:0}
.bilan .t{font:600 20px var(--titre);margin-bottom:4px}
.bilan.travail{border-color:var(--orange);background:var(--orange-voile)}
.bilan.pret{border-color:var(--juste);background:var(--juste-voile)}
.entete-q{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.jauge{flex:1;height:10px;background:var(--trait);border-radius:5px;overflow:hidden}
.jauge span{display:block;height:100%;background:var(--matiere-fort);transition:width .3s}
.compteur{font-size:15px;color:var(--encre-douce)}
.carte-q{background:var(--carte);border:2px solid var(--trait);border-radius:var(--rayon);padding:16px;margin-bottom:14px}
.carte-q .theme{font-size:15px;color:var(--encre-douce);margin:0 0 4px}
.carte-q .enonce{font-size:21px;font-weight:700;margin:0}
.grand{display:block;font:700 30px var(--titre);margin-top:6px}
.choix .btn{font-weight:400}
.choix .btn.juste{border-color:var(--juste);background:var(--juste-voile)}
.choix .btn.faux{border-color:var(--faux);background:var(--faux-voile)}
.choix .btn.choisi{border-color:var(--matiere-fort);background:#f8fafc}
.saisie{display:flex;gap:8px;margin-bottom:10px}
.saisie input{flex:1;min-width:0;padding:14px;border:2px solid var(--trait);border-radius:var(--rayon);background:#fff;font-size:20px}
.saisie input:focus{border-color:var(--matiere-fort);outline:none}
.saisie .btn{width:auto;margin:0;text-align:center}
.retour{border-radius:var(--rayon);padding:14px 16px;margin:4px 0 14px;border-left:6px solid}
.retour.juste{background:var(--juste-voile);border-color:var(--juste)}
.retour.faux{background:var(--faux-voile);border-color:var(--faux)}
.retour .v{font:600 21px var(--titre);margin:0 0 4px}
.score{font:700 44px var(--titre);margin:0;color:var(--matiere-fort)}
.revoir{list-style:none;padding:0}
.revoir li{padding:10px 0;border-bottom:1px dashed var(--trait)}
.revoir li span{display:block}
.revoir .ok{color:var(--juste);font-weight:700}
.revoir .ko{color:var(--faux);text-decoration:line-through}
.revoir .ko-doux{color:var(--orange);font-weight:700}
.revoir .doux{font-size:16px}
.lecon{background:var(--carte);border:2px solid var(--trait);border-radius:var(--rayon);padding:4px 16px 12px;margin-bottom:14px}
.lecon b{color:var(--matiere-fort)}
.lecon table{border-collapse:collapse;width:100%;font-size:16px;margin:8px 0}
.lecon td,.lecon th{border:1px solid var(--trait);padding:6px;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ====== Ajouts propres aux langues : images, écoute ====== */
.visuel{display:flex;justify-content:center;gap:6px;margin-top:10px}
.visuel svg{width:110px;height:110px}
.visuel.deux svg{width:88px;height:88px}
.choix.images{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:10px}
.choix.images .btn{margin:0;padding:8px;display:flex;justify-content:center;align-items:center}
.choix.images svg{width:100%;max-width:110px;height:auto}
.ecoute{background:#eef3ff;border:2px solid var(--matiere);color:var(--matiere-fort);border-radius:999px;padding:8px 16px;font-weight:700;margin:10px 0 0}
.note{background:#fffbea;border:2px dashed #e5d38a;border-radius:10px;padding:10px 14px;margin-top:10px;font:400 18px/1.5 var(--texte)}
.vocab{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin:8px 0}
.vocab div{border:1px solid var(--trait);border-radius:10px;padding:6px;text-align:center;font-size:16px;line-height:1.3}
.vocab svg{width:56px;height:56px;display:block;margin:0 auto 2px}
.vocab button{background:none;border:0;padding:2px 6px;font-size:18px}
.pastille{display:inline-block;width:18px;height:18px;border-radius:50%;border:1.5px solid #1f2a44;vertical-align:-3px;margin-right:6px}
.phrases p{margin:0 0 8px}
.phrases button{background:none;border:0;padding:0 4px;font-size:18px}
</style>
</head>
<body>
<header class="couverture">
  <div class="barre-haut"><a href="index.html">‹ Mes révisions</a><button id="sommaire" class="cache">Menu</button></div>
  <div class="etiquette"><p>Anglais · le matériel scolaire</p><h1>What's in your schoolbag?</h1></div>
</header>
<main id="page"></main>

<script>
/* --- Voix (synthèse vocale) et micro (reconnaissance vocale) de l'appareil --- */
var SYNTHESE = ("speechSynthesis" in window) && ("SpeechSynthesisUtterance" in window);
var Reco = window.SpeechRecognition || window.webkitSpeechRecognition;
var MICRO_KO = false;   /* devient vrai si le micro est refusé : on passe à l'auto-vérification */
function voixAnglaise(){ if(!SYNTHESE) return null; var v=speechSynthesis.getVoices();
  return v.filter(function(x){ return /^en[-_]GB/i.test(x.lang); })[0] || v.filter(function(x){ return /^en/i.test(x.lang); })[0] || null; }
if(SYNTHESE){ try{ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged=function(){}; }catch(e){ SYNTHESE=false; } }
function tais(){ try{ if(SYNTHESE && (speechSynthesis.speaking||speechSynthesis.pending)) speechSynthesis.cancel(); }catch(e){} }
function dire(t){
  if(!SYNTHESE) return;
  try{ tais(); var u=new SpeechSynthesisUtterance(t), v=voixAnglaise(); u.lang="en-GB"; u.rate=.85; if(v) u.voice=v; speechSynthesis.speak(u); }catch(e){}
}
/* Écoute l'élève une fois ; cb(erreur, [transcriptions possibles]) */
function ecouterEleve(cb){
  var fini=false, r;
  function fin(e,a){ if(!fini){ fini=true; cb(e,a); } }
  try{ tais(); r=new Reco(); r.lang="en-GB"; r.interimResults=false; r.maxAlternatives=5; r.continuous=false; }catch(e){ return fin("not-allowed"); }
  r.onresult=function(e){ var a=[]; for(var i=0;i<e.results[0].length;i++) a.push(e.results[0][i].transcript); fin(null,a); };
  r.onerror=function(e){ fin(e.error||"no-speech"); };
  r.onend=function(){ fin("no-speech"); };
  try{ r.start(); }catch(e){ fin("not-allowed"); }
  setTimeout(function(){ try{ r.stop(); }catch(e){} },7000);
}
/* Une des transcriptions correspond-elle à une réponse admise ? (articles et espaces ignorés) */
function oralJuste(alts,q){
  function net(x){ return norm(x).replace(/^(a|an|the|it's|it is) /,"").replace(/^(a|an|the) /,""); }
  for(var i=0;i<alts.length;i++){
    var n=net(alts[i]);
    for(var j=0;j<q.r.length;j++){ var m=net(q.r[j]);
      if(n===m || n.replace(/ /g,"")===m.replace(/ /g,"") || (" "+n+" ").indexOf(" "+m+" ")>=0) return alts[i]; }
  }
  return null;
}

var COLORABLES = ["schoolbag","diary","pencilcase","pen","gluestick","calculator","rubber","setsquare","ruler","highlighter","notebook","book","colouringpencil"];

function art(s,bon,opts,cle){
  var complet=s.replace("… ", bon===ZERO?"":bon+" ").replace(/(^|\. |— )(\w)/g,function(m,a,b){ return a+b.toUpperCase(); });
  var vis=s.replace("…","<b>…</b>");
  return {type:"qcm", q:"Complete with a, the or Ø.<br><span style=\"font-weight:400\">"+vis+"</span>", options:opts, r:[bon], ecoute:complet, cle:cle,
    libelle:s, expl:(bon==="a"?EXPL_A:bon==="the"?EXPL_THE:EXPL_Z)+"<br>Phrase complète : <i>"+complet+"</i>",
    bravo:bon==="a"?"Un objet parmi d'autres → a.":bon==="the"?"Un objet précis → the.":"Pluriel, n'importe lesquels → Ø."};
}

/* ---------------- Outils ---------------- */
function $(id){ return document.getElementById(id); }
function H(a,b){ return a+Math.floor(Math.random()*(b-a+1)); }
function unDe(a){ return a[Math.floor(Math.random()*a.length)]; }
function melange(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function tire(a,n){ return melange(a).slice(0,n); }
function echappe(s){ return String(s).replace(/[&<>"]/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function texte(h){ var d=document.createElement("div"); d.innerHTML=String(h).replace(/<br\s*\/?>/g," "); return d.textContent; }
function lire(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }
function ecrire(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
var FICHIER = location.pathname.split("/").pop() || "anglais-schoolbag.html";

function norm(s){ return String(s).toLowerCase().replace(/[’‘`]/g,"'").replace(/\s*-\s*/g," ").replace(/\s+/g," ").trim().replace(/[.!?;,]+$/,"").trim(); }
function estJuste(saisie,q){
  if(q.type==="qcm") return q.r.indexOf(saisie)>=0;
  return q.r.some(function(r){ return norm(saisie)===norm(r); });
}
function nomDe(q,x){ return q.etiquette ? q.etiquette(x) : x; }

/* ---------- Fabrication d'une série sans répétition ---------- */
function vues(){ return lire("vues:"+FICHIER) || []; }
function fabriquer(notion, deja, premier){
  var hist=vues(), q=null, essais=0, types=notion.types, d=premier===undefined?H(0,types.length-1):premier;
  do{ q=types[(d+essais)%types.length](); essais++; }
  while(essais<40 && (!q || deja[q.cle] || (essais<25 && hist.indexOf(q.cle)>=0)));
  for(var k=0; !q && k<200; k++) q=types[k%types.length]();   /* sécurité (type d'écoute indisponible) */
  deja[q.cle]=1; q.notion=notion.nom; return q;
}
function memoriser(qs){ ecrire("vues:"+FICHIER, vues().concat(qs.map(function(q){ return q.cle; })).slice(-150)); }
function serieEntrainement(notion){
  var deja={}, qs=[], d=H(0,notion.types.length-1);
  for(var i=0;i<Q_PAR_ENTRAINEMENT;i++) qs.push(fabriquer(notion,deja,d+i));
  return melange(qs);
}
function notionsActives(){ return NOTIONS.filter(function(n){ return !n.son || SYNTHESE; }); }
function serieControle(){
  var deja={}, qs=[];
  notionsActives().forEach(function(n){ var d=H(0,n.types.length-1); for(var i=0;i<Q_PAR_NOTION_CONTROLE;i++) qs.push(fabriquer(n,deja,d+i)); });
  return melange(qs);
}

/* ---------------- Écrans ---------------- */
var serie=null;
function page(h,retour){ tais(); $("page").innerHTML=h; $("sommaire").classList.toggle("cache",!retour); window.scrollTo(0,0); }
$("sommaire").onclick=accueil;

function listeNoms(l){ return "<b>"+l.map(echappe).join("</b>, <b>")+"</b>"; }
function bilan(){
  var dc=lire("dernier-controle:"+FICHIER);
  if(!dc) return '<div class="bilan"><p class="t">Ready to start!</p><p>Relis la leçon, entraîne-toi sur chaque partie, puis fais le test quand tu te sens prêt.</p></div>';
  if(dc.bon/dc.total>=SEUIL_PRET)
    return '<div class="bilan pret"><p class="t">✓ You\'re ready for the test!</p><p>Tu es prêt pour l\'évaluation : '+dc.bon+' / '+dc.total+' au dernier test.'+
      (dc.aRevoir&&dc.aRevoir.length ? ' Petit point à relire avant : '+listeNoms(dc.aRevoir)+'.' : '')+'</p></div>';
  return '<div class="bilan travail"><p class="t">Not quite ready yet</p><p>Pas encore tout à fait prêt. Dernier test : '+dc.bon+' / '+dc.total+'. '+
    (dc.aRevoir&&dc.aRevoir.length ? 'Encore à réviser : '+listeNoms(dc.aRevoir)+'. ' : '')+
    'Entraîne-toi sur ces parties, puis reviens te tester quand tu te sens prêt.</p></div>';
}

function accueil(){
  serie=null;
  var rec=lire("meilleur:"+FICHIER), dc=lire("dernier-controle:"+FICHIER)||{};
  var h=bilan()+'<button class="btn" id="b-lecon">Read the lesson<small>Relire la leçon : l\'essentiel à savoir</small></button>';
  h+='<h2>Practise</h2>';
  NOTIONS.forEach(function(n,i){
    var e=lire("entr:"+FICHIER+":"+n.nom), arev=dc.aRevoir&&dc.aRevoir.indexOf(n.nom)>=0;
    if(n.son && !SYNTHESE){ h+='<button class="btn" disabled style="opacity:.6">'+echappe(n.nom)+'<small>'+n.fr+' · ⚠ pas de son dans cette fenêtre : ouvre l\'exercice dans Chrome ou Safari</small></button>'; return; }
    h+='<button class="btn'+(arev?' plein':'')+'" data-n="'+i+'">'+echappe(n.nom)+'<small>'+n.fr+' · '+Q_PAR_ENTRAINEMENT+' questions'+
       (e?' · last try: '+e.bon+' / '+e.total:'')+(arev?' · à revoir':'')+'</small></button>';
  });
  var nbC=notionsActives().length*Q_PAR_NOTION_CONTROLE;
  h+='<h2>Test yourself</h2><button class="btn" id="b-ctrl">Take the test<small>'+nbC+' questions sur toute la leçon, correction à la fin'+(rec?' · best score: '+rec.bon+' / '+rec.total:'')+'</small></button>';
  page(h,false);
  $("b-lecon").onclick=lecon;
  [].forEach.call(document.querySelectorAll("[data-n]"),function(b){ b.onclick=function(){ demarrer("entrainement", NOTIONS[+b.dataset.n]); }; });
  $("b-ctrl").onclick=function(){ demarrer("controle"); };
}

function lecon(){
  page('<div class="lecon">'+LECON+'</div><button class="btn plein centre" id="b-go">Back to the menu</button>', true);
  $("b-go").onclick=accueil;
  [].forEach.call(document.querySelectorAll("[data-dire]"),function(b){ if(!SYNTHESE) b.classList.add("cache"); b.onclick=function(){ dire(b.dataset.dire); }; });
}

function demarrer(mode, notion){
  var qs = mode==="controle" ? serieControle() : serieEntrainement(notion);
  memoriser(qs);
  serie={mode:mode, notion:notion, qs:qs, nb:qs.length, i:0, bon:0, erreurs:[], rattrapage:[], enRattrapage:false};
  question();
}

function question(){
  if(serie.i>=serie.qs.length){
    if(serie.mode==="entrainement" && !serie.enRattrapage && serie.rattrapage.length){
      serie.enRattrapage=true;
      var deja={}; serie.qs.forEach(function(q){ deja[q.cle]=1; });
      serie.qs=serie.qs.concat(serie.rattrapage.map(function(){ var q=fabriquer(serie.notion,deja); q.reprise=true; return q; }));
    } else return fin();
  }
  var q=serie.qs[serie.i], total=serie.qs.length;
  var h='<div class="entete-q"><div class="jauge"><span style="width:'+Math.round(serie.i/total*100)+'%"></span></div>'+
        '<span class="compteur">'+(serie.i+1)+' / '+total+'</span></div>';
  if(q.reprise) h+='<p class="doux">Let\'s try again, with a new question.</p>';
  h+='<div class="carte-q"><p class="theme">'+echappe(serie.mode==="controle"?"Test":q.notion)+'</p><p class="enonce">'+q.q+
     (q.grand?'<span class="grand">'+echappe(q.grand)+'</span>':'')+'</p>'+(q.visuel||'')+
     (q.audio?'<button class="ecoute" type="button" id="b-audio">🔊 Listen again</button>':'')+'</div>';
  if(q.type==="qcm"){
    q.ordre=melange(q.options);
    h+='<div class="choix'+(q.images?' images':'')+'">'+q.ordre.map(function(o,k){
      return '<button class="btn" data-k="'+k+'"'+(q.images?' aria-label="Picture '+(k+1)+'"':'')+'>'+(q.images?img(o):echappe(o))+'</button>'; }).join("")+'</div>';
  } else if(q.type==="oral"){
    h+='<div id="oral"></div>';
  } else {
    h+='<div class="saisie" id="f"><input id="in" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-gramm="false" aria-label="Your answer">'+
       '<button class="btn plein" type="button" id="valider">Check</button></div>';
  }
  h+='<div id="retour"></div>';
  page(h,true);
  if(q.audio){ $("b-audio").onclick=function(){ dire(q.audio); }; dire(q.audio); }
  if(q.type==="qcm"){
    [].forEach.call(document.querySelectorAll(".choix .btn"),function(b){ b.onclick=function(){ repondre(q.ordre[+b.dataset.k], b); }; });
  } else if(q.type==="oral"){
    oralUI(q);
  } else {
    var valider=function(){ var v=$("in").value; if(v.trim() && !$("in").disabled) repondre(v); };
    $("valider").onclick=valider;
    $("in").onkeydown=function(e){ if(e.key==="Enter"){ e.preventDefault(); valider(); } };
    setTimeout(function(){ try{ $("in").focus({preventScroll:true}); }catch(e){} },50);
  }
}

/* Question orale : micro si possible, sinon l'élève dit le mot, écoute le modèle et s'auto-évalue */
function oralUI(q){
  if(!Reco || MICRO_KO) return autoEval(q);
  $("oral").innerHTML='<button class="btn plein centre" type="button" id="b-micro">🎤 Say it</button><p id="msg-oral" class="doux"></p>';
  $("b-micro").onclick=function(){
    var b=$("b-micro"); b.disabled=true; b.textContent="🎤 I'm listening…"; $("msg-oral").textContent="";
    ecouterEleve(function(err,alts){
      if(!$("b-micro") || serie.qs[serie.i]!==q) return;
      if(err){
        if(err!=="no-speech" && err!=="aborted"){ MICRO_KO=true; return autoEval(q,"Le micro n'est pas disponible ici : dis le mot à voix haute, puis vérifie avec le modèle."); }
        b.disabled=false; b.textContent="🎤 Say it"; $("msg-oral").textContent="I didn't hear you. Try again!"; return;
      }
      var bon=oralJuste(alts,q);
      repondre(bon||alts[0], null, !!bon);
    });
  };
}
function autoEval(q,msg){
  $("oral").innerHTML=(msg?'<p class="doux">'+msg+'</p>':'')+'<p><b>Say it out loud. Then listen.</b></p>'+
    '<button class="ecoute" type="button" id="b-modele">🔊 Listen</button>'+
    '<div id="auto" class="rangee cache" style="margin-top:12px"><button class="btn centre" type="button" id="b-oui">✓ I said it right</button><button class="btn centre" type="button" id="b-non">✗ Not quite</button></div>';
  if(!SYNTHESE){ $("b-modele").textContent="Check"; }
  $("b-modele").onclick=function(){ dire(q.ecoute); if(!SYNTHESE) $("b-modele").outerHTML='<p>Le mot : <b>'+echappe(q.ecoute)+'</b></p>'; $("auto").classList.remove("cache"); };
  $("b-oui").onclick=function(){ q.auto=true; repondre("(je l'ai bien dit)",null,true); };
  $("b-non").onclick=function(){ q.auto=true; repondre("(pas encore bien dit)",null,false); };
}

function repondre(donne, bouton, force){
  var q=serie.qs[serie.i], ok=(force!==undefined)?force:estJuste(donne,q);
  if(ok && !q.reprise) serie.bon++;
  if(!ok && !q.reprise){
    serie.erreurs.push({q:q.libelle||texte(q.q)+(q.grand?" → "+q.grand:""), donne:(q.type==="oral"&&!q.auto?"« "+donne+" »":nomDe(q,donne)), bonne:nomDe(q,q.r[0]), notion:q.notion, expl:q.expl});
    serie.rattrapage.push(1);
  }
  [].forEach.call(document.querySelectorAll(".choix .btn, #f input, #f button, #oral button"),function(el){ el.disabled=true; });
  var dernier = serie.i+1>=serie.qs.length && (serie.mode==="controle" || serie.enRattrapage || !serie.rattrapage.length);

  if(serie.mode==="controle"){
    if(bouton) bouton.classList.add("choisi");
    $("retour").innerHTML='<button class="btn plein centre" id="suite">'+(dernier?"See my score":"Next question")+'</button>';
    $("suite").onclick=suivante; $("suite").focus({preventScroll:true}); return;
  }
  if(bouton){
    [].forEach.call(document.querySelectorAll(".choix .btn"),function(b,k){
      if(q.r.indexOf(q.ordre[k])>=0) b.classList.add("juste"); else if(b===bouton) b.classList.add("faux");
    });
  }
  var h='<div class="retour '+(ok?"juste":"faux")+'" role="status"><p class="v">'+(ok?unDe(["Well done!","Great!","Yes!"]):"Not quite!")+'</p>';
  var entendu=(q.type==="oral"&&!q.auto)?'J\'ai entendu « '+echappe(donne)+' ». ':'';
  if(ok) h+='<p>'+entendu+q.bravo+'</p>';
  else if(q.type==="oral") h+='<p>'+entendu+'Il fallait dire : <b>'+echappe(q.ecoute)+'</b></p><p>'+q.expl+'</p>';
  else h+='<p>Tu as répondu « '+echappe(nomDe(q,donne))+' ». La réponse : <b>'+echappe(nomDe(q,q.r[0]))+'</b></p><p>'+q.expl+'</p>';
  if(q.ecoute && SYNTHESE) h+='<button class="ecoute" type="button" id="b-rep">🔊 Listen and repeat</button>';
  if(!ok && q.type==="oral" && Reco && !MICRO_KO) h+=' <button class="ecoute" type="button" id="b-redire">🎤 Say it again</button><p id="msg-redire" class="doux" style="margin-top:6px"></p>';
  h+='</div>';
  if(!ok && q.recopie){
    h+='<p><b>Copy the right answer:</b> '+echappe(q.r[0])+'</p><div class="saisie" id="f2"><input id="in2" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-gramm="false" aria-label="Copy">'+
       '<button class="btn plein" type="button" id="ok2">OK</button></div><p id="msg2" class="doux"></p>';
  }
  h+='<button class="btn plein centre'+(!ok&&q.recopie?' cache':'')+'" id="suite">'+(dernier?"See my score":"Next question")+'</button>';
  $("retour").innerHTML=h;
  $("suite").onclick=suivante;
  if($("b-rep")){ $("b-rep").onclick=function(){ dire(q.ecoute); }; dire(q.ecoute); }   /* correction par la voix : on entend toujours le bon modèle */
  if($("b-redire")){ $("b-redire").onclick=function(){   /* pour s'entraîner : ne change pas le score */
    var b=$("b-redire"); b.disabled=true; $("msg-redire").textContent="I'm listening…";
    ecouterEleve(function(err,alts){
      if(!$("b-redire")) return; b.disabled=false;
      if(err){ $("msg-redire").textContent="I didn't hear you. Try again!"; return; }
      $("msg-redire").textContent = oralJuste(alts,q) ? "Well done! C'est bien dit." : "J'ai entendu « "+alts[0]+" ». Écoute encore le modèle et réessaie.";
    });
  }; }
  if($("f2")){
    $("in2").focus({preventScroll:true});
    var verifier=function(){
      if($("in2").disabled) return;
      if(estJuste($("in2").value,q)){ $("in2").disabled=true; $("ok2").disabled=true; $("msg2").textContent="Well done! C'est bien écrit."; $("suite").classList.remove("cache"); $("suite").focus({preventScroll:true}); }
      else $("msg2").textContent="Pas encore identique : regarde bien chaque lettre.";
    };
    $("ok2").onclick=verifier;
    $("in2").onkeydown=function(e){ if(e.key==="Enter"){ e.preventDefault(); verifier(); } };
  } else $("suite").focus({preventScroll:true});
  $("retour").scrollIntoView({block:"nearest",behavior:"smooth"});
}
function suivante(){ serie.i++; question(); }

function fin(){
  var n=serie.nb, s=serie.bon, r=s/n, h='';
  if(serie.mode==="controle"){
    var noms=[]; serie.erreurs.forEach(function(e){ if(noms.indexOf(e.notion)<0) noms.push(e.notion); });
    ecrire("dernier-controle:"+FICHIER,{bon:s,total:n,aRevoir:noms,date:Date.now()});
    var prev=lire("meilleur:"+FICHIER);
    if(!prev || r>prev.bon/prev.total) ecrire("meilleur:"+FICHIER,{bon:s,total:n});
    h+='<h2>Your test score</h2><p class="score">'+s+' / '+n+'</p>'+bilan();
    h+='<h3>Part by part</h3><ul class="revoir">'+notionsActives().map(function(no){
      var tot=serie.qs.filter(function(q){ return q.notion===no.nom; }).length;
      var err=serie.erreurs.filter(function(e){ return e.notion===no.nom; }).length;
      return '<li>'+echappe(no.nom)+' <span class="doux">('+no.fr+')</span><span class="'+(err?'ko-doux':'ok')+'">'+(tot-err)+' / '+tot+(err?' : à retravailler':' : réussi')+'</span></li>';
    }).join("")+'</ul>';
  } else {
    ecrire("entr:"+FICHIER+":"+serie.notion.nom,{bon:s,total:n});
    h+='<h2>'+echappe(serie.notion.nom)+'</h2><p class="score">'+s+' / '+n+'</p>';
    h+='<p>'+(s===n?"Perfect! 🎉 Tu maîtrises cette partie.":r>=SEUIL_PRET?"Great! Relis les corrections ci-dessous.":
         "Keep going! Cette partie n'est pas encore sûre : relis la leçon et recommence, les questions changent à chaque fois.")+'</p>';
  }
  if(serie.erreurs.length){
    h+='<h3>Corrections</h3><ul class="revoir">'+serie.erreurs.map(function(e){
      return '<li>'+echappe(e.q)+'<span class="ko">'+echappe(e.donne)+'</span><span class="ok">'+echappe(e.bonne)+'</span>'+
             (serie.mode==="controle"?'<span class="doux">'+e.expl+'</span>':'')+'</li>';
    }).join("")+'</ul>';
  }
  h+='<div class="rangee"><button class="btn plein centre" id="encore">Try again</button><button class="btn centre" id="retour-acc">Menu</button></div>';
  page(h,true);
  var m=serie.mode, no=serie.notion;
  $("encore").onclick=function(){ demarrer(m,no); };
  $("retour-acc").onclick=accueil;
}

accueil();
</script>
</body>
</html>
