<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Das Alphabet</title>
<link rel="stylesheet" href="kit.css">
<style>
  .ecouter{ display:block; width:100%; text-align:center; margin:12px 0 0; font-size:20px; }
  .mini{ border:2px solid var(--trait); background:#fff; border-radius:8px; padding:2px 8px; font-size:15px; }
  .sons{ display:flex; gap:8px; margin-top:12px; }
  .sons .mini{ flex:1; padding:10px 4px; font-size:17px; font-weight:700; }
  .ligne-son{ display:flex; gap:8px; margin:0 0 10px; }
  .ligne-son .mini{ flex:1; font-size:17px; font-weight:700; padding:12px 6px; }
  .ligne-son .btn{ flex:1; margin:0; text-align:center; }
  .lecon td:first-child{ font-family:var(--titre); font-size:20px; }
  .lecon tr.piege td{ background:var(--presque-voile); }
  .lecon td.ph{ color:var(--encre-douce); font-size:14px; }
</style>
</head>
<body>
<script src="kit.js"></script>
<script>
/* =============== Audio : voix allemande de l'appareil =============== */
window.Dire = function(t){
  if(!("speechSynthesis" in window)){ alert("Cet appareil ne sait pas lire à voix haute."); return; }
  speechSynthesis.cancel();
  var u = new SpeechSynthesisUtterance(t);
  u.lang = "de-DE"; u.rate = 0.8;
  var v = speechSynthesis.getVoices().filter(function(x){ return /^de/i.test(x.lang); })[0];
  if(v) u.voice = v;
  speechSynthesis.speak(u);
};
if("speechSynthesis" in window){
  speechSynthesis.getVoices();
  /* iPhone/iPad : la voix doit être « débloquée » par un premier toucher */
  document.addEventListener("click", function deblo(){
    try{ speechSynthesis.speak(new SpeechSynthesisUtterance("")); }catch(e){}
    document.removeEventListener("click", deblo);
  });
}
function ecouter(t, petit, auto){
  return '<button type="button" class="'+(petit?'mini':'btn plein ecouter')+'" data-t="'+t+'"'+(auto?' data-auto="1"':'')+
         ' onclick="Dire(this.dataset.t)">🔊'+(petit?'':' Écouter')+'</button>';
}
/* Plusieurs sons à comparer : la bonne réponse est « Son 1 », « Son 2 »… */
function sons(bonne, autres){
  var tous = Revision.melange([bonne].concat(autres.filter(function(a,i){ return a!==bonne && autres.indexOf(a)===i; })));
  var noms = tous.map(function(t,i){ return "Son "+(i+1); });
  var juste = noms[tous.indexOf(bonne)];
  return {
    image:'<div class="sons">'+tous.map(function(t,i){ return '<button type="button" class="mini" data-t="'+t+'" onclick="Dire(this.dataset.t)">🔊 '+(i+1)+'</button>'; }).join("")+'</div>',
    r: juste, autres: noms.filter(function(x){ return x!==juste; })
  };
}
/* Fait tourner une liste dans un ordre mélangé, sans répéter deux fois de suite */
function tourniquet(liste){
  var file=[], dernier=null;
  return function(){
    if(!file.length){ file=Revision.melange(liste); if(file.length>1 && file[0]===dernier) file.push(file.shift()); }
    return (dernier=file.shift());
  };
}

/* =============== Les lettres : [écriture « à la française » (soutien), nom allemand pour la voix] =============== */
var L = {
  A:["a","A"], B:["bé","Be"], C:["tsé","Tse"], D:["dé","De"], E:["é","E"], F:["èf","Ef"],
  G:["gué","Ge"], H:["ha","Ha"], I:["i","I"], J:["yott","Jott"], K:["ka","Ka"], L:["èl","El"],
  M:["èm","Em"], N:["èn","En"], O:["o","O"], P:["pé","Pe"], Q:["kou","Ku"], R:["èr","Er"],
  S:["èss","Es"], T:["té","Te"], U:["ou","U"], V:["faou","Vau"], W:["vé","We"], X:["iks","Ix"],
  Y:["upsilonn","Ypsilon"], Z:["tsètt","Zett"], "Ä":["è","Ä"], "Ö":["eu","Ö"], "Ü":["u","Ü"], "ß":["èss-tsètt","Eszett"]
};
var FACILES = ["A","B","D","F","K","L","M","N","O","P","R","S","T","X"];
/* Avec quelles lettres chacune se confond, et un coup de pouce */
var PIEGE = {
  C:{conf:["S","Z","K"], aide:"En français, cette lettre se dit « sé »."},
  E:{conf:["I","Ä","A"], aide:"Une voyelle qui, en français, se dit « eu »."},
  G:{conf:["J","Q","K"], aide:"En français, cette lettre se dit « jé »."},
  H:{conf:["A","R","K"], aide:"En français, on l'appelle « ache »."},
  I:{conf:["E","Y","J"], aide:"Elle se dit comme en français. Ce n'est pas le E !"},
  J:{conf:["G","I","Y"], aide:"En français, cette lettre se dit « ji »."},
  Q:{conf:["U","K","Ü"], aide:"Elle est presque toujours suivie d'un U."},
  U:{conf:["Ü","O","Q"], aide:"Une voyelle sans Umlaut."},
  V:{conf:["W","F","U"], aide:"Ce n'est ni le F, ni le W !"},
  W:{conf:["V","B","U"], aide:"Ce n'est pas le V !"},
  Y:{conf:["J","I","Ü"], aide:"En français, on l'appelle « i grec »."},
  Z:{conf:["C","S","ß"], aide:"C'est la dernière lettre de l'alphabet."},
  "Ä":{conf:["E","A","Ö"], aide:"Une lettre avec un Umlaut (les deux points)."},
  "Ö":{conf:["O","Ü","E"], aide:"Une lettre avec un Umlaut (les deux points)."},
  "Ü":{conf:["U","I","Y"], aide:"Une lettre avec un Umlaut. Ce n'est pas le U !"},
  "ß":{conf:["S","Z","B"], aide:"Une lettre qui n'existe qu'en allemand (« scharfes S »)."}
};
function confusions(l){
  if(PIEGE[l]) return PIEGE[l].conf;
  return Revision.melange(FACILES.filter(function(x){ return x!==l; })).slice(0,3);
}
/* Les lettres travaillées par petites familles de lettres qui se confondent */
var FAMILLES = [
  {id:"fac", nom:"les lettres « comme en français »", ls:FACILES},
  {id:"VW",  nom:"V et W",       ls:["V","W"]},
  {id:"EI",  nom:"E et I",       ls:["E","I"]},
  {id:"JG",  nom:"J et G",       ls:["J","G"]},
  {id:"ZC",  nom:"Z, C et ß",    ls:["Z","C","ß"]},
  {id:"HQY", nom:"H, Q et Y",    ls:["H","Q","Y"]},
  {id:"UU",  nom:"U et Ü",       ls:["U","Ü"]},
  {id:"AO",  nom:"Ä et Ö",       ls:["Ä","Ö"]}
];

/* =============== Épeler =============== */
var MOTS = ["Wie","Vogel","Zug","Junge","Uhr","Hallo","Wasser","Zebra","Juli","Eis","Hund","Vater","Zimmer","Jacke"];
var MOTS_UMLAUT = ["Käse","Bär","Mädchen","Brötchen","schön","Tschüs","Bücher","grün","groß","Fuß","Straße","Fußball"];
function lettres(mot){ return mot.split("").map(function(c){ return c==="ß" ? "ß" : c.toUpperCase(); }); }
function epeler(mot){ return lettres(mot).map(function(c){ return L[c][0]; }).join(" – "); }
function voix(mot){ return lettres(mot).map(function(c){ return L[c][1]; }).join(", "); }
var ECHANGES = [["w","v"],["v","w"],["z","c"],["j","g"],["ie","ei"],["ei","ie"],["e","i"],["u","ü"],["ü","u"],
                ["ä","e"],["ä","a"],["ö","o"],["ß","ss"],["ss","ß"],["ch","sch"],["ll","l"],["ä","ö"],["a","ä"]];
function variantes(mot, liste){
  var bas=mot.toLowerCase(), maj=mot[0]!==mot[0].toLowerCase(), out=[];
  Revision.melange(ECHANGES).forEach(function(e){
    if(bas.indexOf(e[0])<0) return;
    var v=bas.replace(e[0],e[1]); if(maj) v=v[0].toUpperCase()+v.slice(1);
    if(v!==mot && out.indexOf(v)<0) out.push(v);
  });
  Revision.melange(liste).forEach(function(m){ if(m!==mot && out.length<3) out.push(m); });
  return out.slice(0,3);
}

/* =============== Les notions =============== */
var notions = [];
FAMILLES.forEach(function(f){
  var pourDire = tourniquet(f.ls), pourEntendre = tourniquet(f.ls);
  /* THÈME : je vois la lettre, je la dis, je vérifie à l'oreille */
  notions.push({ id:"dire-"+f.id, nom:"Dire "+f.nom, theme:"Dire une lettre", qcmSeul:true,
    q:"Dis cette lettre à voix haute. Puis écoute les sons : lequel est juste ?",
    gen:function(){
      var l=pourDire(), s=sons(L[l][1], confusions(l).map(function(x){ return L[x][1]; }));
      return { grand:l, image:s.image, r:s.r, autres:s.autres,
        explication:"En allemand, "+l+" se dit "+ecouter(L[l][1],true)+' <span class="doux">(à peu près « '+L[l][0]+' »)</span>' };
    } });
  /* VERSION : j'entends la lettre, je la reconnais, puis je l'écris */
  notions.push({ id:"entendre-"+f.id, nom:"Reconnaître à l'oreille "+f.nom, theme:"Reconnaître une lettre", strict:true,
    q:"Écoute : quelle lettre est dite ?",
    gen:function(){
      var l=pourEntendre();
      return { image:ecouter(L[l][1],false,true), r:[l].concat(l==="ß"?["ẞ"]:[]), autres:confusions(l),
        aide:(PIEGE[l]?PIEGE[l].aide:"Elle se dit comme en français.")+' <span class="doux">On l\'entend à peu près « '+L[l][0]+' ».</span>',
        explication:"C'était "+l+" "+ecouter(L[l][1],true)+' <span class="doux">(à peu près « '+L[l][0]+' »)</span>' };
    } });
});
var motSimple = tourniquet(MOTS), motUmlaut = tourniquet(MOTS_UMLAUT), motDire = tourniquet(MOTS.concat(MOTS_UMLAUT));
notions.push(
  { id:"ecrire-mot", nom:"Écrire un mot qu'on m'épelle", theme:"Épeler", strict:true,
    q:"Écoute le mot épelé, puis écris-le.",
    gen:function(){ var m=motSimple();
      return { image:ecouter(voix(m),false,true), r:m, autres:variantes(m,MOTS),
        aide:'<span class="doux">À peu près : '+epeler(m)+'</span>',
        explication:ecouter(voix(m),true)+' <span class="doux">('+epeler(m)+')</span>' }; } },
  { id:"ecrire-umlaut", nom:"Écrire un mot épelé avec ä, ö, ü ou ß", theme:"Épeler", strict:true,
    q:"Écoute le mot épelé, puis écris-le.",
    gen:function(){ var m=motUmlaut();
      return { image:ecouter(voix(m),false,true), r:m, autres:variantes(m,MOTS_UMLAUT),
        aide:'Utilise les touches sous la case. <span class="doux">À peu près : '+epeler(m)+'</span>',
        explication:ecouter(voix(m),true)+' <span class="doux">('+epeler(m)+')</span>' }; } },
  { id:"epeler-mot", nom:"Épeler un mot à voix haute", theme:"Épeler", qcmSeul:true,
    q:"Épelle ce mot à voix haute. Puis écoute : quel son l'épelle correctement ?",
    gen:function(){ var m=motDire(), s=sons(voix(m), variantes(m,MOTS.concat(MOTS_UMLAUT)).slice(0,2).map(voix));
      return { grand:m, image:s.image, r:s.r, autres:s.autres,
        explication:ecouter(voix(m),true)+' <span class="doux">('+epeler(m)+')</span>' }; } }
);

/* =============== Petits ajustements d'affichage =============== */
new MutationObserver(function(){
  /* lecture automatique du son de la question */
  var b=document.querySelector(".carte-q [data-auto]:not([data-fait])");
  if(b){ b.setAttribute("data-fait","1"); setTimeout(function(){ Dire(b.dataset.t); }, 350); }
  /* QCM de sons : chaque haut-parleur est placé sur la même ligne que son bouton de réponse.
     On ne change pas l'ordre des boutons (le kit s'en sert pour colorer la bonne réponse). */
  var c=document.getElementById("k-choix"), zone=document.querySelector(".carte-q .sons");
  if(c && zone && !c.getAttribute("data-map")){
    var bs=[].slice.call(c.querySelectorAll(".btn")), hp=[].slice.call(zone.children), map={};
    if(bs.length && bs.every(function(x){ return /^Son \d$/.test(x.textContent); })){
      bs.forEach(function(b,j){
        var k=+b.textContent.slice(4), ligne=document.createElement("div");
        ligne.className="ligne-son"; c.insertBefore(ligne,b);
        hp[k-1].textContent="🔊 Son "+(j+1); ligne.appendChild(hp[k-1]); ligne.appendChild(b);
        b.textContent="C'est celui-ci"; map[k]=j+1;
      });
      c.setAttribute("data-map", JSON.stringify(map));
      zone.parentNode.removeChild(zone);
    }
  }
  /* dans la correction, « Son 3 » devient le numéro affiché à l'écran */
  var mp=c && c.getAttribute("data-map");
  if(mp){ [].forEach.call(document.querySelectorAll(".retour b"), function(x){
    var m=/^Son (\d)$/.exec(x.textContent); if(m) x.textContent="le son "+JSON.parse(mp)[m[1]];
  }); }
  /* dans le bilan, « Son 2 » ne veut rien dire : on renvoie à la leçon */
  [].forEach.call(document.querySelectorAll(".revoir li span"), function(s){
    if(/^Son \d$/.test(s.textContent)) s.textContent="Réécoute-la dans la leçon";
  });
}).observe(document.documentElement, {childList:true, subtree:true});

/* =============== La leçon =============== */
var lignes = Object.keys(L).map(function(l){
  return '<tr'+(PIEGE[l]?' class="piege"':'')+'><td>'+l+'</td><td>'+ecouter(L[l][1],true)+'</td><td class="ph">'+L[l][0]+'</td></tr>';
}).join("");
var lecon =
  "<h3>Das Alphabet</h3>"+
  "<p>L'alphabet allemand a les mêmes 26 lettres que le français, plus <b>ä, ö, ü</b> (avec <i>Umlaut</i>) et <b>ß</b>.</p>"+
  "<p>Touche 🔊 pour entendre chaque lettre et <b>répète-la à voix haute</b>. Les <b>lettres pièges</b> sont surlignées. "+
  "La colonne grise aide seulement à se souvenir : c'est le son qu'il faut retenir.</p>"+
  "<table><tr><th>Lettre</th><th>Écoute</th><th>À peu près</th></tr>"+lignes+"</table>"+
  "<h3>À ne pas confondre</h3>"+
  "<p><b>V</b> "+ecouter("Vau",true)+" et <b>W</b> "+ecouter("We",true)+"<br>"+
  "<b>E</b> "+ecouter("E",true)+" et <b>I</b> "+ecouter("I",true)+"<br>"+
  "<b>J</b> "+ecouter("Jott",true)+" et <b>G</b> "+ecouter("Ge",true)+"<br>"+
  "<b>Z</b> "+ecouter("Zett",true)+" et <b>C</b> "+ecouter("Tse",true)+"<br>"+
  "<b>U</b> "+ecouter("U",true)+" et <b>Ü</b> "+ecouter("Ü",true)+"</p>"+
  "<h3>Pour épeler</h3>"+
  "<p>On te demandera souvent : <i>Wie schreibt man das?</i> (Comment ça s'écrit ?). Exemple : <b>Wie</b> "+ecouter("We, I, E",true)+"</p>";

Revision.lancer({
  matiere: "Allemand",
  titre: "L'alphabet allemand",
  intro: "Écoute, répète, reconnais : tout se fait à l'oral. Monte le son !",
  lecon: lecon,
  controle: 10, serie: 12,
  clavier: ["ä","ö","ü","ß"],
  accents: "exiges",
  notions: notions
});
</script>
</body>
</html>
