<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Les nombres de 13 à 19</title>
<link rel="stylesheet" href="kit.css">
<style>
  /* Boutons d'écoute propres à cet exercice */
  .ecoute{ display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  .ecoute button, button.son{
    border:2px solid var(--matiere-fort); background:var(--matiere-voile); color:var(--encre);
    border-radius:12px; padding:10px 14px; font-weight:700;
  }
  .ecoute button.gros{ font-size:20px; padding:12px 18px; }
  button.son{ padding:2px 8px; border-radius:8px; font-size:15px; }
  /* « Je dis » : chaque proposition = un haut-parleur + le bouton pour la choisir */
  .prop{ display:flex; gap:8px; align-items:stretch; margin:0 0 10px; }
  .prop .btn{ margin:0; flex:1; min-width:0; }
  .prop button.ecouter{
    flex:none; border:2px solid var(--matiere-fort); background:var(--matiere-voile); color:var(--encre);
    border-radius:var(--rayon); padding:0 16px; font-weight:700; font-size:20px;
  }
  .prop button.ecouter.joue{ background:var(--matiere); color:var(--matiere-encre); }
  .choix .btn .mot{ display:none; }
  .choix .btn:disabled .mot{ display:inline; font-weight:700; }
  .choix .btn:disabled .choisir{ display:none; }
  /* « J'écris » étape 2 : le mot est donné en modèle, on le recopie */
  .aide .masque{ display:none; }
  .modele{ display:block; font-family:var(--titre); font-size:28px; letter-spacing:.04em; margin-top:2px; }
  .lecon .dit{ color:var(--encre-douce); font-style:italic; }
  .avertissement{ font-size:15px; background:var(--presque-voile); border-left:4px solid var(--presque); padding:8px 10px; border-radius:8px; }
</style>
</head>
<body>
<script src="kit.js"></script>
<script>
/* ---------------- La voix allemande (synthèse vocale de l'appareil) ---------------- */
var voixDe = null;
function chercherVoix(){
  if(!window.speechSynthesis) return;
  var v = speechSynthesis.getVoices().filter(function(x){ return /^de/i.test(x.lang); });
  voixDe = v.filter(function(x){ return /de[-_]DE/i.test(x.lang); })[0] || v[0] || null;
}
if(window.speechSynthesis){ chercherVoix(); speechSynthesis.onvoiceschanged = chercherVoix; }
var prevenu = false;
function dire(mot, lent){
  if(!window.speechSynthesis){
    if(!prevenu){ prevenu=true; alert("Cet appareil ne sait pas lire à voix haute. Essaie avec un autre navigateur (Chrome, Safari)."); }
    return;
  }
  speechSynthesis.cancel();
  var u = new SpeechSynthesisUtterance(mot);
  u.lang = "de-DE"; if(voixDe) u.voice = voixDe;
  u.rate = lent ? 0.55 : 0.85;
  speechSynthesis.speak(u);
}
/* Un seul écouteur pour tous les boutons « data-dire » */
document.addEventListener("click", function(ev){
  var b = ev.target.closest && ev.target.closest("[data-dire]");
  if(!b) return;
  ev.preventDefault();
  dire(b.getAttribute("data-dire"), b.hasAttribute("data-lent"));
  [].forEach.call(document.querySelectorAll(".prop .ecouter"), function(x){ x.classList.remove("joue"); });
  if(b.classList.contains("ecouter")) b.classList.add("joue");
});
new MutationObserver(function(){
  /* « Je reconnais » : le nombre est dit tout seul quand la question s'affiche */
  var a = document.querySelector(".carte-q [data-auto]:not([data-fait])");
  if(a){ a.setAttribute("data-fait",""); setTimeout(function(){ dire(a.getAttribute("data-dire")); }, 350); }
  /* « Je dis » : les choix deviennent des propositions à écouter (le mot écrit n'apparaît qu'après la réponse) */
  var ch = document.getElementById("k-choix"), s = window.Revision && Revision._serie && Revision._serie();
  if(ch && !ch.hasAttribute("data-fait") && s && s.courant && s.courant.n.theme==="Je dis"){
    ch.setAttribute("data-fait","");
    [].forEach.call(ch.querySelectorAll(".btn"), function(b){
      var mot=b.textContent, ligne=document.createElement("div");
      ligne.className="prop";
      ligne.innerHTML='<button type="button" class="ecouter" data-dire="'+mot+'" aria-label="Écouter cette proposition">🔊</button>';
      b.innerHTML='<span class="choisir">C\'est comme ça qu\'on dit</span><span class="mot">'+mot+'</span>';
      ch.insertBefore(ligne, b); ligne.appendChild(b);
    });
  }
}).observe(document.documentElement, {childList:true, subtree:true});

/* ---------------- Les nombres (du plus simple au plus piégeux) ---------------- */
var NOMBRES = [
  /* chiffre, mot, « ça se dit à peu près », chiffres proches (écoute), fautes d'écriture, fausses façons de dire */
  {c:14, m:"vierzehn", dit:"fir-tsén",  proches:["40","4","13"], ecrit:["vierzen","zehnvier","vierzig"], oral:["zehnvier","vierzig","vier zehn"]},
  {c:18, m:"achtzehn", dit:"art-tsén (ch raclé au fond de la gorge)", proches:["80","8","19"], ecrit:["achtzen","zehnacht","achtzig"], oral:["zehnacht","achtzig","acht"]},
  {c:19, m:"neunzehn", dit:"noïn-tsén", proches:["90","9","18"], ecrit:["neunzen","zehnneun","neunzig"], oral:["zehnneun","neunzig","neun"]},
  {c:13, m:"dreizehn", dit:"draï-tsén", proches:["30","3","14"], ecrit:["dreizen","zehndrei","dreißig"], oral:["zehndrei","dreißig","drei"]},
  {c:15, m:"fünfzehn", dit:"funnf-tsén (ü = le « u » français)", proches:["50","5","16"], ecrit:["funfzehn","zehnfünf","fünfzig"], oral:["zehnfünf","fünfzig","fünf"], aussi:["fuenfzehn"]},
  {c:16, m:"sechzehn", dit:"zèch-tsén (ch doux, comme un chat qui souffle)", proches:["60","6","17"], ecrit:["sechszehn","zehnsechs","sechzig"], oral:["sechszehn","zehnsechs","sechzig"],
   piege:"<b>sechs</b> perd son <b>s</b> : on écrit <b>sechzehn</b>, pas « sechszehn »."},
  {c:17, m:"siebzehn", dit:"zîp-tsén", proches:["70","7","16"], ecrit:["siebenzehn","zehnsieben","siebzig"], oral:["siebenzehn","zehnsieben","siebzig"],
   piege:"<b>sieben</b> perd son <b>en</b> : on écrit <b>siebzehn</b>, pas « siebenzehn »."}
];
function son(mot){ return ' <button type="button" class="son" data-dire="'+mot+'" aria-label="Écouter '+mot+'">🔊</button>'; }

/* Trois parties, dans cet ordre : je reconnais (à l'oral) → je dis → j'écris.
   Le moteur ouvre les notions dans l'ordre de la liste, donc on commence par reconnaître 14, 18, 19, 13… */
/* Point 2 : j'entends un nombre et je trouve son écriture chiffrée */
var reconnais = NOMBRES.map(function(x){ return {
  id:"entendre-"+x.c, nom:"J'entends "+x.c, theme:"Je reconnais", chiffres:true,
  q:"Écoute et trouve le nombre en chiffres.",
  image:'<div class="ecoute"><button type="button" class="gros" data-dire="'+x.m+'" data-auto>🔊 Réécouter</button>'+
        '<button type="button" data-dire="'+x.m+'" data-lent>🐢 Plus lentement</button></div>',
  r:[String(x.c)], autres:x.proches,
  explication:"Tu as entendu <b>"+x.m+"</b>"+son(x.m)+" = "+x.c+". Fin en <b>-zehn</b> : entre 13 et 19. Fin en <b>-zig</b> (ou -ßig) : une dizaine comme "+x.proches[0]+"."
}; });

var dis = NOMBRES.map(function(x){ return {
  id:"dire-"+x.c, nom:"Je dis "+x.c, theme:"Je dis", qcmSeul:true,
  q:"Dis ce nombre à voix haute en allemand. Puis écoute les propositions : laquelle est juste ?",
  grand:String(x.c), r:[x.m], autres:x.oral,
  explication:"On dit <b>"+x.m+"</b>"+son(x.m)+", à peu près « "+x.dit+" ». Répète-le deux fois à voix haute."
}; });

var ecris = NOMBRES.map(function(x){ return {
  id:"ecrire-"+x.c, nom:"J'écris "+x.c+" en lettres", theme:"J'écris", strict:true,
  q:"Écris ce nombre en lettres, en allemand.", grand:String(x.c),
  r:[x.m].concat(x.aussi||[]), autres:x.ecrit,
  aide:"Recopie le mot :<span class=\"modele\">"+x.m+"</span>",
  explication:(x.piege || "On dit d'abord l'unité (<b>"+x.m.replace("zehn","")+"</b>), puis <b>zehn</b>, collés en un seul mot.")+son(x.m)
}; });

Revision.lancer({
  matiere:"Allemand",
  titre:"Les nombres de 13 à 19",
  intro:"Fais les points dans l'ordre. Monte le son !",
  parties:[
    {titre:"J'entends un nombre et je l'écris en chiffres", theme:"Je reconnais"},
    {titre:"Je dis les nombres à l'oral", theme:"Je dis"},
    {titre:"J'écris en lettres à partir des chiffres", theme:"J'écris"}
  ],
  serie:12, controle:12,
  accents:"exiges",
  clavier:["ü","ß"],
  lecon:
    '<h3>La règle : l\'unité d\'abord, puis zehn</h3>'+
    '<p>En allemand, on dit « trois-dix » : <b>drei</b> + <b>zehn</b> = <b>dreizehn</b>. Tout est collé en un seul mot. C\'est comme en anglais : <i>four</i> + <i>teen</i> = <i>fourteen</i>.</p>'+
    '<table><tr><th>Nombre</th><th>En allemand</th><th>Ça se dit à peu près</th></tr>'+
    NOMBRES.slice().sort(function(a,b){ return a.c-b.c; }).map(function(x){
      return '<tr><td><b>'+x.c+'</b></td><td>'+x.m+son(x.m)+'</td><td class="dit">'+x.dit.replace(/ \(.*\)/,"")+'</td></tr>';
    }).join("")+'</table>'+
    '<p class="doux">La prononciation entre guillemets est une approximation avec des sons français : écoute toujours le 🔊.</p>'+
    '<h3>Deux pièges à l\'écrit</h3>'+
    '<p><b>16 = sechzehn</b> : sechs perd son s.'+son("sechzehn")+'<br><b>17 = siebzehn</b> : sieben perd son en.'+son("siebzehn")+'</p>'+
    '<h3>Ne pas confondre -zehn et -zig</h3>'+
    '<p><b>vierzehn</b> = 14'+son("vierzehn")+' mais <b>vierzig</b> = 40'+son("vierzig")+'. Écoute bien la fin du mot !</p>'+
    '<h3>Bien prononcer</h3>'+
    '<p><b>z</b> se dit « ts » (zehn = « tsén »). <b>ei</b> se dit « aï » (drei). <b>eu</b> se dit « oï » (neun). <b>ü</b> se dit comme le « u » français.</p>'+
    '<p class="avertissement">Pour t\'entraîner à <b>dire</b> un nombre : dis-le d\'abord tout haut, puis écoute chaque proposition 🔊 et choisis celle qui est juste.</p>',
  notions: reconnais.concat(dis, ecris)
});
</script>
</body>
</html>
