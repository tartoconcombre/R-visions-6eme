}

/* ====== Propre à cet exercice : décor « paillasse de labo », tableaux de conversion, éprouvette ====== */

.eprouvette{display:block;margin:8px auto 0;width:180px;height:auto}
.doc{background:#fffdf5;border:2px solid #e7dfc4;border-radius:12px;padding:10px 14px;margin:10px 0 0;font-size:17px;font-weight:400}

.doc p{margin:0 0 4px}
.lecon table.cube td{border:0;padding:2px 8px 2px 0;vertical-align:middle}
.corr{margin-top:8px}
@media print{ .couverture,.noprint{display:none!important} body{background:#fff} }

<script>
/* ======================= CONTENU DE L'EXERCICE ======================= */
var Q_PAR_ENTRAINEMENT = 6;
var Q_PAR_NOTION_CONTROLE = 3;   /* 6 parties → contrôle de 18 questions */
var SEUIL_PRET = 0.8;

/* ---------- Nombres décimaux écrits en texte (aucune erreur d'arrondi) ---------- */
/* propre("0012,500") → "12,5" */
function propre(s){
  var p=s.split(","), e=p[0].replace(/^0+/,"")||"0", d=(p[1]||"").replace(/0+$/,"");
  return d?e+","+d:e;
}
/* decaler("0,548",3) → "548" : multiplie par 10^n en déplaçant la virgule */
function decaler(s,n){
  var p=s.split(","), e=p[0], d=p[1]||"", ch=e+d, pos=e.length+n;
  if(pos<=0){ ch="0".repeat(1-pos)+ch; pos=1; }
  if(pos>ch.length) ch=ch+"0".repeat(pos-ch.length);
  return propre(ch.slice(0,pos)+","+ch.slice(pos));
}
/* Ce que l'élève tape → forme canonique ; "" si ce n'est pas un nombre */
function canonNombre(t){
  var s=String(t).replace(/[\s\u00a0\u202f]/g,"").replace(/\./g,",").replace(/(dam|dm|cm|mm|m)(3|³)$/i,"").replace(/[a-z]+$/i,"");
  if(!/^\d*,?\d+$|^\d+,$/.test(s)) return "";
  if(s.charAt(0)===",") s="0"+s;
  return propre(s.replace(/,$/,""));
}
/* "14872,5" → "14 872,5" (espaces des milliers, insécables) */
function fmt(s){
  var p=s.split(","); p[0]=p[0].replace(/\B(?=(\d{3})+(?!\d))/g," ");
  return p.join(",");
}

/* ---------- Les tableaux de conversion, comme dans le cahier ---------- */
var T_MASSE = { cols:["t","q","","kg","hg","dag","g","dg","cg","mg"] };
/* Tableau des volumes du cahier : chaque unité « cube » occupe 3 colonnes ; son chiffre des unités est dans la colonne où son nom est écrit */
var T_VOL = { cols:["","","","kL","hL","daL","L","dL","cL","mL","","",""],
              cols2:["dam³","","","m³","","","dm³","","","cm³","","","mm³"] };
function colDe(T,u){ var i=T.cols.indexOf(u); if(i<0&&T.cols2) i=T.cols2.indexOf(u); return i; }
function unitesColonne(T,c){ var r=[]; if(T.cols[c]) r.push(T.cols[c]); if(T.cols2&&T.cols2[c]) r.push(T.cols2[c]); return r; }

/* Dessine le tableau rempli : nombre placé (chiffre des unités dans la colonne de départ), zéros ajoutés en orange,
   virgule rouge juste après la colonne d'arrivée */
function tableau(T,s,uDep,uArr,court){
  var cDep=colDe(T,uDep), cArr=colDe(T,uArr), p=s.split(","), e=p[0], d=p[1]||"", cases={};
  for(var i=0;i<e.length;i++) cases[cDep-(e.length-1-i)]=e.charAt(i);
  for(var j=0;j<d.length;j++) cases[cDep+1+j]=d.charAt(j);
  var cs=Object.keys(cases).map(Number), mini=Math.min.apply(null,cs.concat([cArr])), maxi=Math.max.apply(null,cs.concat([cArr]));
  var g=Math.min(0,mini), dr=Math.max(T.cols.length-1,maxi);
  if(court){ g=Math.max(g,mini-1); dr=Math.min(dr,maxi+1); }   /* correction sur téléphone : seulement les colonnes utiles */
  function th(lbl,c){ var cl=c===cDep&&c===cArr?"arr":c===cDep?"dep":c===cArr?"arr":(lbl?"":"vide2"); return '<th class="'+cl+'">'+lbl+'</th>'; }
  var h1="",h2="",td="";
  for(var c=g;c<=dr;c++){
    var dedans=c>=0&&c<T.cols.length;
    h1+=th(dedans?T.cols[c]:"",c);
    if(T.cols2) h2+=th(dedans?T.cols2[c]:"",c);
    var v=cases[c], zero=false;
    if(v===undefined && ((c>maxDig(cs)&&c<=cArr) || (c<minDig(cs)&&c>=cArr))){ v="0"; zero=true; }
    td+='<td class="'+(zero?"zero ":"")+(c===cArr?"virg ":"")+(dedans?"":"hors")+'">'+(v||"")+'</td>';
  }
  return '<div class="tab-wrap"><table class="conv"><tr>'+h1+'</tr>'+(T.cols2?'<tr>'+h2+'</tr>':'')+'<tr>'+td+'</tr></table></div>';
}
function minDig(cs){ return Math.min.apply(null,cs); }
function maxDig(cs){ return Math.max.apply(null,cs); }
var LEG_TAB='<p class="leg-tab"><span style="background:#dbeafe">départ</span><span style="background:#fde68a">arrivée</span> la virgule (rouge) se place juste après la colonne d\'arrivée ; <span style="color:#b45309;font-weight:700">0</span> = zéro ajouté</p>';

/* Fabrique une conversion : nombre au hasard, adapté au décalage pour que le résultat reste raisonnable */
function nombrePour(decal){
  for(var k=0;k<200;k++){
    var n=H(1,4), ch=String(H(1,9)); for(var i=1;i<n;i++) ch+=H(0,9);
    var dec=H(0,Math.min(n,3)), s=dec===n?"0,"+ch:(dec?ch.slice(0,n-dec)+","+ch.slice(n-dec):ch);
    s=propre(s);
    var r=decaler(s,decal), pr=r.split(","), ps=s.split(",");
    if(pr[0].length<=7 && (pr[1]||"").length<=4 && (ps[1]||"").length<=3 && r!=="0") return [s,r];
  }
  return ["3",decaler("3",decal)];
}
function conversion(T,uDep,uArr,cle){
  var dec=colDe(T,uArr)-colDe(T,uDep), sr=nombrePour(dec), s=sr[0], r=sr[1];
  return {s:s, r:r, uDep:uDep, uArr:uArr, cle:cle+uDep+uArr+s};
}
function explConv(T,c){
  var e=c.s.split(",")[0];
  return "Le chiffre des unités de "+fmt(c.s)+" ("+e.charAt(e.length-1)+") va dans la colonne "+c.uDep+
    ". La virgule se place juste après la colonne "+c.uArr+" ; on complète avec des zéros les colonnes vides. Donc "+fmt(c.s)+" "+c.uDep+" = "+fmt(c.r)+" "+c.uArr+".";
}
/* Trois façons de demander une conversion */
function qConvertir(T,uDep,uArr,cle,theme){
  var c=conversion(T,uDep,uArr,cle);
  return {type:"saisie", nombre:true, q:"Convertis :", grand:fmt(c.s)+" "+uDep+" = … "+uArr, unite:uArr,
    r:[c.r], affR:fmt(c.r)+" "+uArr, cle:c.cle, corrHtml:LEG_TAB+tableau(T,c.s,uDep,uArr,true),
    expl:explConv(T,c), bravo:fmt(c.s)+" "+uDep+" = "+fmt(c.r)+" "+uArr+" : la virgule est bien juste après la colonne "+uArr+"."};
}
function qUnite(T,uDep,uArr,cle){
  var c=conversion(T,uDep,uArr,cle), ok=unitesColonne(T,colDe(T,uArr));
  return {type:"saisie", q:"Quelle unité manque ?", grand:fmt(c.s)+" "+uDep+" = "+fmt(c.r)+" …",
    r:ok, affR:ok.join(" ou "), verif:function(t){ var n=normU(t); return ok.some(function(u){ return normU(u)===n; }); },
    cle:"u"+c.cle, corrHtml:LEG_TAB+tableau(T,c.s,uDep,uArr,true),
    expl:"Place "+fmt(c.s)+" dans le tableau (chiffre des unités dans la colonne "+uDep+"). La virgule de "+fmt(c.r)+" tombe juste après la colonne "+ok.join(" / ")+".",
    bravo:"La virgule de "+fmt(c.r)+" est juste après la colonne "+ok.join(" / ")+"."};
}
function normU(t){ return String(t).replace(/\s/g,"").replace(/3$/,"³").replace(/^dal$/i,"daL").toLowerCase(); }

/* Choix des unités (les unités rares sont tirées moins souvent) */
var U_MASSE=["t","q","kg","kg","hg","dag","g","g","g","dg","cg","mg","mg"];
var U_LITRE=["kL","hL","daL","L","L","L","dL","cL","cL","mL","mL"];
var U_CUBE=["dam³","m³","m³","dm³","dm³","cm³","cm³","mm³"];
function deuxUnites(pool,sens,T){
  for(var k=0;k<100;k++){
    var a=unDe(pool), b=unDe(pool), d=colDe(T,b)-colDe(T,a);
    if(a===b||d===0) continue;
    if(sens==="petite"&&d<0) continue;
    if(sens==="grande"&&d>0) continue;
    if(Math.abs(d)>6) continue;
    return [a,b];
  }
  return sens==="grande"?[unDe(["mg","cg","g"]),"kg"]:["kg","g"];
}

/* ---------- L'éprouvette graduée (dessin) ---------- */
/* g = valeur d'une graduation ; n = nombre de graduations ; un nombre est écrit toutes les « pas » graduations */
var EPR = [ {g:1,n:25,pas:5}, {g:2,n:25,pas:5}, {g:5,n:20,pas:4}, {g:10,n:25,pas:5}, {g:2,n:30,pas:5}, {g:1,n:30,pas:10}, {g:5,n:30,pas:2} ];
function eprouvette(cfg,niv){
  var H0=292, Ht=48, pasY=(H0-Ht)/cfg.n, y=function(t){ return H0-t*pasY; }, xg=62, xd=118, h="";
  h+='<rect width="180" height="340" fill="#fff"/>';
  var yl=y(niv);
  h+='<path d="M'+(xg+1.5)+' '+(yl-6)+' Q'+((xg+xd)/2)+' '+(yl+6)+' '+(xd-1.5)+' '+(yl-6)+' V'+(H0+16)+' H'+(xg+1.5)+' Z" fill="#7dd3fc" opacity=".75"/>';
  h+='<path d="M'+(xg+1.5)+' '+(yl-6)+' Q'+((xg+xd)/2)+' '+(yl+6)+' '+(xd-1.5)+' '+(yl-6)+'" fill="none" stroke="#0369a1" stroke-width="1.6"/>';
  for(var t=1;t<=cfg.n;t++){
    var maj=t%cfg.pas===0, yy=y(t);
    h+='<line x1="'+xg+'" y1="'+yy+'" x2="'+(xg+(maj?22:12))+'" y2="'+yy+'" stroke="#1f2a44" stroke-width="'+(maj?1.8:1.1)+'"/>';
    if(maj) h+='<text x="'+(xg-6)+'" y="'+(yy+4.5)+'" text-anchor="end" font-size="13" font-weight="700" font-family="Atkinson Hyperlegible,Verdana,sans-serif" fill="#1f2a44">'+(t*cfg.g)+'</text>';
  }
  h+='<path d="M'+(xg-4)+' 30 Q'+(xg-2)+' 24 '+xg+' 24 V'+(H0+18)+' H'+xd+' V24 H'+(xd+6)+'" fill="none" stroke="#1f2a44" stroke-width="2.5" stroke-linejoin="round"/>';
  h+='<rect x="'+(xg-18)+'" y="'+(H0+18)+'" width="'+(xd-xg+36)+'" height="10" rx="3" fill="#1f2a44"/>';
  h+='<text x="'+(xd+8)+'" y="'+(Ht+4)+'" font-size="13" font-family="Atkinson Hyperlegible,Verdana,sans-serif" fill="#55607a">mL</text>';
  return '<svg class="eprouvette" viewBox="0 0 180 340" role="img" aria-label="Éprouvette graduée en mL"><title>Éprouvette graduée (mL)</title>'+h+'</svg>';
}
function tirageEpr(){
  var cfg=unDe(EPR), t;
  do{ t=H(2,cfg.n-2); }while(t%cfg.pas===0 && Math.random()<.85);
  return {cfg:cfg, t:t, v:t*cfg.g};
}
function explEpr(e){
  var c=e.cfg, base=Math.floor(e.t/c.pas)*c.pas, k=e.t-base, ecart=c.pas*c.g;
  var g="Entre deux nombres écrits ("+fmt(String((base||c.pas)*c.g))+" et "+fmt(String(((base||c.pas)+c.pas)*c.g))+"), il y a "+c.pas+" intervalles : une graduation vaut "+ecart+" ÷ "+c.pas+" = "+c.g+" mL. ";
  var l = base ? "Le bas du ménisque est "+(k?k+" graduation"+(k>1?"s":"")+" au-dessus de "+base*c.g+" : "+base*c.g+" + "+k+" × "+c.g+" = "+e.v+" mL.":"exactement sur "+e.v+" mL.")
               : "Le bas du ménisque est à "+k+" graduation"+(k>1?"s":"")+" : "+k+" × "+c.g+" = "+e.v+" mL.";
  return g+l;
}

function lire(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }
function ecrire(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
var FICHIER = location.pathname.split("/").pop() || "exercices-physique-masse-volume.html";
if(!/\.html$/.test(FICHIER)) FICHIER="exercices-physique-masse-volume.html";

/* Correction tolérante sur la forme (majuscules, accents, article, pluriel) ; stricte sur les nombres */
function norm(s){
  s=String(s).toLowerCase().trim().replace(/[’`]/g,"'").replace(/œ/g,"oe");
  s=s.normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[«»"“”.,;:!?()]/g," ").trim();
  s=s.replace(/^(c'est|il est|elle est|ce sont)\s+/,"").replace(/^(une|un|des|du|de la|de l'|les|la|le|de)\s+/,"").replace(/^(d|l)'\s*/,"");
  s=s.replace(/[-'°]/g," ").replace(/\s+/g,"");
  if(s.length>3) s=s.replace(/[sx]$/,"");
  return s;
}
function bon(saisie,r){ var n=norm(saisie); return n!=="" && r.some(function(x){ return norm(x)===n; }); }
function estJuste(saisie,q){
  if(q.verif) return q.verif(saisie);
  if(q.nombre){ var c=canonNombre(saisie); return c!=="" && q.r.some(function(x){ return propre(x)===c; }); }
  return bon(saisie,q.r);
}
function bonneTexte(q){ return q.affR || q.r[0]; }

/* ---------- Fabrication d'une série sans répétition ---------- */
function vues(){ return lire("vues:"+FICHIER) || []; }
function fabriquer(notion, deja, premier){
  var hist=vues(), q, essais=0, types=notion.types, d=premier===undefined?H(0,types.length-1):premier;
  do{ q=types[(d+essais)%types.length](); essais++; }
  while(essais<40 && (deja[q.cle] || (essais<25 && hist.indexOf(q.cle)>=0)));
  deja[q.cle]=1; q.notion=notion.nom; return q;
}
function memoriser(qs){
  var h=vues().concat(qs.map(function(q){ return q.cle; }));
  ecrire("vues:"+FICHIER, h.slice(-150));
}
function serieEntrainement(notion){
  var deja={}, qs=[], d=H(0,notion.types.length-1);
  for(var i=0;i<Q_PAR_ENTRAINEMENT;i++) qs.push(fabriquer(notion,deja,d+i));
  return melange(qs);
}
function serieControle(){
  var deja={}, qs=[];
  NOTIONS.forEach(function(n){ var d=H(0,n.types.length-1); for(var i=0;i<Q_PAR_NOTION_CONTROLE;i++) qs.push(fabriquer(n,deja,d+i)); });
  return melange(qs);
}

/* ---------------- Écrans ---------------- */
var serie=null;
function page(h,retour){ $("page").innerHTML=h; $("sommaire").classList.toggle("cache",!retour); window.scrollTo(0,0); }
$("sommaire").onclick=accueil;

function listeNoms(l){ return "<b>"+l.map(echappe).join("</b>, <b>")+"</b>"; }
function bilan(){
  var dc=lire("dernier-controle:"+FICHIER);
  if(!dc) return '<div class="bilan">'+mascotte("calme")+'<div><p class="t">Prêt à commencer</p><p>Relis la leçon, entraîne-toi sur chaque partie, puis fais le contrôle quand tu te sens prêt.</p></div></div>';
  if(dc.bon/dc.total>=SEUIL_PRET)
    return '<div class="bilan pret">'+mascotte("joie")+'<div><p class="t">✓ Tu es prêt pour l\'évaluation</p><p>Tu as eu '+dc.bon+' / '+dc.total+' au dernier contrôle.'+
      (dc.aRevoir&&dc.aRevoir.length ? ' Petit point à relire avant : '+listeNoms(dc.aRevoir)+'.' : '')+'</p></div></div>';
  return '<div class="bilan travail">'+mascotte("encourage")+'<div><p class="t">Pas encore tout à fait prêt</p><p>Dernier contrôle : '+dc.bon+' / '+dc.total+'. '+
    (dc.aRevoir&&dc.aRevoir.length ? 'Encore à réviser : '+listeNoms(dc.aRevoir)+'. ' : '')+
    'Entraîne-toi sur ces parties, puis reviens te tester quand tu te sens prêt.</p></div></div>';
}

function accueil(){
  serie=null;
  var rec=lire("meilleur:"+FICHIER), dc=lire("dernier-controle:"+FICHIER)||{};
  var h=bilan()+'<button class="btn" id="b-lecon">Relire la leçon<small>Le cours, les tableaux de conversion corrigés et la lecture de l\'éprouvette</small></button>';
  h+='<h2>S\'entraîner</h2>';
  NOTIONS.forEach(function(n,i){
    var e=lire("entr:"+FICHIER+":"+n.nom), arev=dc.aRevoir&&dc.aRevoir.indexOf(n.nom)>=0;
    h+='<button class="btn'+(arev?' plein':'')+'" data-n="'+i+'">'+echappe(n.nom)+'<small>'+Q_PAR_ENTRAINEMENT+' questions'+
       (e?' · dernier essai : '+e.bon+' / '+e.total:'')+(arev?' · à revoir':'')+'</small></button>';
  });
  var nbC=NOTIONS.length*Q_PAR_NOTION_CONTROLE;
  h+='<h2>Se tester</h2><button class="btn" id="b-ctrl">Faire le contrôle<small>'+nbC+' questions sur toute la leçon, correction à la fin'+(rec?' · meilleur score : '+rec.bon+' / '+rec.total:'')+'</small></button>';
  page(h,false);
  $("b-lecon").onclick=lecon;
  [].forEach.call(document.querySelectorAll("[data-n]"),function(b){ b.onclick=function(){ demarrer("entrainement", NOTIONS[+b.dataset.n]); }; });
  $("b-ctrl").onclick=function(){ demarrer("controle"); };
}

function lecon(){
  page('<div class="lecon">'+LECON+'</div><button class="btn plein centre" id="b-go">Retour au sommaire</button>', true);
  $("b-go").onclick=accueil;
}

function demarrer(mode, notion){
  var qs = mode==="controle" ? serieControle() : serieEntrainement(notion);
  memoriser(qs);
  serie={mode:mode, notion:notion, qs:qs, nb:qs.length, i:0, bon:0, erreurs:[], rattrapage:[], enRattrapage:false};
  question();
}

function champSaisie(id,label,nombre){
  return '<input id="'+id+'" type="text"'+(nombre?' inputmode="decimal"':'')+' autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-gramm="false" aria-label="'+echappe(label)+'">';
}

function question(){
  if(serie.i>=serie.qs.length){
    if(serie.mode==="entrainement" && !serie.enRattrapage && serie.rattrapage.length){
      serie.enRattrapage=true;
      var deja={}; serie.qs.forEach(function(q){ deja[q.cle]=1; });
      serie.qs=serie.qs.concat(serie.rattrapage.map(function(){ var q=fabriquer(serie.notion,deja); q.reprise=true; return q; }));
    } else return fin();
  }
  var q=serie.qs[serie.i], total=serie.qs.length;
  var h='<div class="entete-q"><div class="jauge"><span style="width:'+Math.round(serie.i/total*100)+'%"></span></div>'+
        '<span class="compteur">'+(serie.i+1)+' / '+total+'</span></div>';
  if(q.reprise) h+='<p class="doux">On y revient, avec une autre question.</p>';
  h+='<div class="carte-q"><p class="theme">'+echappe(serie.mode==="controle"?"Contrôle":q.notion)+'</p>'+
     '<p class="enonce">'+q.q+(q.grand?'<span class="grand">'+echappe(q.grand)+'</span>':'')+'</p>'+(q.doc||'')+'</div>';
  if(q.type==="qcm"){
    q.ordre=melange(q.options);
    h+='<div class="choix">'+q.ordre.map(function(o,k){ return '<button class="btn" data-k="'+k+'">'+echappe(o)+'</button>'; }).join("")+'</div>';
  } else {
    h+='<div class="saisie" id="f">'+champSaisie("in","Ta réponse",q.nombre)+(q.unite?'<span class="unite">'+echappe(q.unite)+'</span>':'')+
       '<button class="btn plein" type="button" id="valider">Valider</button></div>';
  }
  h+='<div id="retour"></div>';
  page(h,true);
  if(q.type==="qcm"){
    [].forEach.call(document.querySelectorAll(".choix .btn"),function(b){ b.onclick=function(){ repondre(q.ordre[+b.dataset.k], b); }; });
  } else {
    var valider=function(){ var v=$("in").value; if(v.trim() && !$("in").disabled) repondre(v); };
    $("valider").onclick=valider;
    $("in").onkeydown=function(e){ if(e.key==="Enter"){ e.preventDefault(); valider(); } };
    if(!q.doc) setTimeout(function(){ try{ $("in").focus({preventScroll:true}); }catch(e){} },50);
  }
}

function repondre(donne, bouton){
  var q=serie.qs[serie.i], ok=q.type==="qcm" ? q.r.indexOf(donne)>=0 : estJuste(donne,q);
  var txtDonne=donne+(q.unite&&q.nombre&&/\d\s*$/.test(donne)?" "+q.unite:""), txtBonne=bonneTexte(q);
  if(ok && !q.reprise) serie.bon++;
  if(!ok && !q.reprise){
    serie.erreurs.push({q:texte(q.q)+(q.grand?" "+q.grand:""), donne:txtDonne, bonne:txtBonne, notion:q.notion, expl:q.expl, corrHtml:q.corrHtml});
    serie.rattrapage.push(1);
  }
  [].forEach.call(document.querySelectorAll(".choix .btn, #f input, #f button"),function(el){ el.disabled=true; });
  var dernier = serie.i+1>=serie.qs.length && (serie.mode==="controle" || serie.enRattrapage || !serie.rattrapage.length);

  if(serie.mode==="controle"){
    if(bouton) bouton.classList.add("choisi");
    $("retour").innerHTML='<button class="btn plein centre" id="suite">'+(dernier?"Voir mon résultat":"Question suivante")+'</button>';
    $("suite").onclick=suivante; $("suite").focus({preventScroll:true}); return;
  }
  if(bouton){
    [].forEach.call(document.querySelectorAll(".choix .btn"),function(b,k){
      if(q.r.indexOf(q.ordre[k])>=0) b.classList.add("juste"); else if(b===bouton) b.classList.add("faux");
    });
  }
  var h='<div class="retour '+(ok?"juste":"faux")+'" role="status">'+mascotte(ok?"joie":"encourage")+'<div><p class="v">'+(ok?unDe(["Juste !","Bravo !","Exact !"]):"Pas tout à fait")+'</p>';
  if(ok) h+='<p>'+echappe(q.bravo)+'</p>';
  else h+=(q.type==="qcm"?'':'<p>Tu as répondu « '+echappe(txtDonne)+' ». La réponse : <b>'+echappe(txtBonne)+'</b></p>')+'<p>'+echappe(q.expl)+'</p>'+(q.corrHtml?'<div class="corr">'+q.corrHtml+'</div>':'');
  h+='</div></div><button class="btn plein centre" id="suite">'+(dernier?"Voir mon résultat":"Question suivante")+'</button>';
  $("retour").innerHTML=h;
  $("suite").onclick=suivante;
  $("suite").focus({preventScroll:true});
  $("retour").scrollIntoView({block:"nearest",behavior:"smooth"});
}
function suivante(){ serie.i++; question(); }

function fin(){
  var n=serie.nb, s=serie.bon, r=s/n, h='';
  var humeur = r>=SEUIL_PRET ? "joie" : "encourage";
  if(serie.mode==="controle"){
    var noms=[]; serie.erreurs.forEach(function(e){ if(noms.indexOf(e.notion)<0) noms.push(e.notion); });
    ecrire("dernier-controle:"+FICHIER,{bon:s,total:n,aRevoir:noms,date:Date.now()});
    var prev=lire("meilleur:"+FICHIER);
    if(!prev || r>prev.bon/prev.total) ecrire("meilleur:"+FICHIER,{bon:s,total:n});
    h+='<h2>Résultat du contrôle</h2><div class="fin-tete">'+mascotte(humeur)+'<p class="score">'+s+' / '+n+'</p></div>'+bilan();
    h+='<h3>Partie par partie</h3><ul class="revoir">'+NOTIONS.map(function(no){
      var tot=serie.qs.filter(function(q){ return q.notion===no.nom; }).length;
      var err=serie.erreurs.filter(function(e){ return e.notion===no.nom; }).length;
      return '<li>'+echappe(no.nom)+'<span class="'+(err?'ko-doux':'ok')+'">'+(tot-err)+' / '+tot+(err?' : à retravailler':' : réussi')+'</span></li>';
    }).join("")+'</ul>';
  } else {
    ecrire("entr:"+FICHIER+":"+serie.notion.nom,{bon:s,total:n});
    h+='<h2>'+echappe(serie.notion.nom)+'</h2><div class="fin-tete">'+mascotte(humeur)+'<p class="score">'+s+' / '+n+'</p></div>';
    h+='<p>'+(s===n?"Sans faute ! Tu maîtrises cette partie.":r>=SEUIL_PRET?"Très bien. Relis les corrections ci-dessous.":
         "Cette partie n'est pas encore sûre. Relis la leçon et recommence : les questions changent à chaque fois.")+'</p>';
  }
  if(serie.erreurs.length){
    h+='<h3>Corrections</h3><ul class="revoir">'+serie.erreurs.map(function(e){
      return '<li>'+echappe(e.q)+'<span class="ko">'+echappe(e.donne)+'</span><span class="ok">'+echappe(e.bonne)+'</span>'+
             (serie.mode==="controle"?'<span class="doux">'+echappe(e.expl)+'</span>'+(e.corrHtml||''):'')+'</li>';
    }).join("")+'</ul>';
  }
  h+='<div class="rangee"><button class="btn plein centre" id="encore">Recommencer</button><button class="btn centre" id="retour-acc">Sommaire</button></div>';
  page(h,true);
  var m=serie.mode, no=serie.notion;
  $("encore").onclick=function(){ demarrer(m,no); };
  $("retour-acc").onclick=accueil;
}

accueil();
</script>
</body>
</html>
