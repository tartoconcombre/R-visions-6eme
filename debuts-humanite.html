<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#7c2d12">
<title>Les débuts de l'humanité</title>
<style>
  :root{
    --ocre:#b45309; --ocre-clair:#fde7c7; --brun:#7c2d12; --encre:#292524;
    --gris:#78716c; --fond:#f6f3ef; --carte:#fff; --ok:#15803d; --ok-f:#dcfce7;
    --ko:#b91c1c; --ko-f:#fee2e2; --trait:#e7e0d8;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;background:var(--fond);color:var(--encre);line-height:1.45}
  .wrap{max-width:620px;margin:0 auto;padding:14px 16px 48px}
  .hidden{display:none!important}
  a.retour{display:inline-block;color:var(--brun);text-decoration:none;font-weight:600;font-size:.95rem;padding:4px 0 10px}
  button{font-family:inherit}

  /* En-tête : la frise des hominidés */
  .tete{background:var(--brun);color:#fff;border-radius:20px;padding:18px 16px 14px;margin-bottom:16px;overflow:hidden}
  .tete h1{margin:0;font-size:1.45rem;line-height:1.2}
  .tete p{margin:4px 0 12px;color:#fed7aa;font-size:.92rem}
  .defile{display:flex;align-items:flex-end;gap:2px;height:120px;border-bottom:3px solid #fdba74;padding:0 4px}
  .defile img{height:100%;width:auto;flex:0 1 auto;min-width:0;object-fit:contain;border-radius:6px 6px 0 0;background:#fff}
  .defile img:nth-child(1){height:62%}.defile img:nth-child(2){height:74%}.defile img:nth-child(3){height:88%}
  .sens{display:flex;justify-content:space-between;font-size:.78rem;color:#fed7aa;margin-top:5px}

  .modes{display:grid;gap:10px}
  .mode{display:flex;align-items:center;gap:14px;text-align:left;background:var(--carte);border:1px solid var(--trait);border-radius:16px;padding:14px;cursor:pointer;color:inherit;font-size:1rem}
  .mode:active{transform:translateY(1px)}
  .mode .ic{flex:0 0 44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:1.4rem;background:var(--ocre-clair)}
  .mode b{display:block;font-size:1.05rem}
  .mode span{color:var(--gris);font-size:.88rem}
  .mode.ctrl{background:var(--ocre);border-color:var(--ocre);color:#fff}
  .mode.ctrl span{color:#fff7ed}
  .mode.ctrl .ic{background:rgba(255,255,255,.2)}
  .record{margin:14px 2px 0;color:var(--gris);font-size:.9rem;text-align:center}

  /* Question */
  .haut{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .haut .compte{font-weight:700;color:var(--brun);white-space:nowrap}
  .barre{flex:1;height:8px;background:var(--trait);border-radius:99px;overflow:hidden}
  .barre span{display:block;height:100%;background:var(--ocre);transition:width .3s}
  .quitter{border:none;background:none;color:var(--gris);font-size:.9rem;cursor:pointer;padding:6px}
  .panneau{background:var(--carte);border:1px solid var(--trait);border-radius:18px;padding:16px}
  .theme{font-size:.8rem;color:var(--ocre);font-weight:700;margin-bottom:4px}
  .enonce{font-size:1.12rem;font-weight:650;margin:0 0 12px}
  .photo{display:flex;justify-content:center;background:#fff;border-radius:14px;border:1px solid var(--trait);padding:8px;margin-bottom:14px}
  .photo img{max-height:230px;max-width:100%;border-radius:8px}
  .opts{display:grid;gap:8px}
  .opt{border:2px solid var(--trait);background:#fff;border-radius:14px;padding:12px 14px;font-size:1rem;text-align:left;cursor:pointer;color:var(--encre)}
  .opt:active{background:var(--fond)}
  .opt.bon{border-color:var(--ok);background:var(--ok-f)}
  .opt.faux{border-color:var(--ko);background:var(--ko-f)}
  .opt:disabled{cursor:default}

  /* Frise : remettre dans l'ordre */
  .aide{color:var(--gris);font-size:.9rem;margin:-4px 0 12px}
  .tuiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
  .tuiles.photos{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
  .tuiles.photos .tuile{padding:6px 3px}
  .tuile{position:relative;border:2px solid var(--trait);background:#fff;border-radius:14px;padding:10px 8px;cursor:pointer;font-size:.95rem;min-height:56px;color:var(--encre)}
  .tuile img{display:block;height:120px;width:100%;object-fit:contain}
  .tuile .num{position:absolute;top:-8px;left:-8px;width:28px;height:28px;border-radius:50%;background:var(--ocre);color:#fff;font-weight:800;display:grid;place-items:center;font-size:.95rem}
  .tuile.choisie{border-color:var(--ocre);background:#fffbf5}
  .tuile.bon{border-color:var(--ok);background:var(--ok-f)}
  .tuile.faux{border-color:var(--ko);background:var(--ko-f)}
  .tuile .nomsol{display:block;font-size:.7rem;line-height:1.15;overflow-wrap:anywhere;font-weight:700;margin-top:4px;color:var(--brun)}
  .solution{margin-top:12px;background:var(--fond);border-radius:12px;padding:10px 12px;font-size:.95rem}
  .solution ol{margin:4px 0 0;padding-left:22px}

  /* Texte à trous */
  .texte{font-size:1.05rem;line-height:2.1}
  .trou{display:inline-block;min-width:92px;border:none;border-bottom:2px dashed var(--ocre);background:var(--ocre-clair);border-radius:6px 6px 0 0;padding:0 8px;font-size:1rem;cursor:pointer;color:var(--encre);line-height:1.8;vertical-align:baseline}
  .trou.actif{outline:2px solid var(--ocre)}
  .trou.rempli{border-bottom-style:solid;font-weight:650}
  .trou.bon{background:var(--ok-f);border-color:var(--ok)}
  .trou.faux{background:var(--ko-f);border-color:var(--ko)}
  .trou small{color:var(--ok);font-weight:700}
  .banque{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .etiq{border:1px solid var(--ocre);background:#fff;color:var(--brun);border-radius:99px;padding:8px 14px;font-size:.95rem;cursor:pointer}
  .etiq:disabled{opacity:.3;cursor:default}

  .actions{display:flex;gap:8px;margin-top:14px}
  .btn{flex:1;border:none;border-radius:14px;padding:13px;font-size:1rem;font-weight:700;background:var(--ocre);color:#fff;cursor:pointer}
  .btn.sec{background:#fff;color:var(--brun);border:2px solid var(--trait)}
  .btn:disabled{opacity:.4;cursor:default}
  .retour-q{margin-top:12px;border-radius:14px;padding:12px 14px;font-size:.95rem}
  .retour-q.ok{background:var(--ok-f);color:#14532d}
  .retour-q.ko{background:var(--ko-f);color:#7f1d1d}
  .retour-q b{display:block;margin-bottom:2px}

  /* Fin */
  .fin{text-align:center}
  .fin .gros{font-size:2.6rem;font-weight:800;color:var(--brun);margin:6px 0}
  .erreurs{text-align:left;padding-left:18px}
  .erreurs li{margin-bottom:8px}
  .erreurs span{display:block;color:var(--ok);font-weight:600}

  /* Leçon en bref */
  .fiche{display:flex;gap:12px;background:#fff;border:1px solid var(--trait);border-radius:16px;padding:12px;margin-bottom:10px}
  .fiche img{flex:0 0 76px;height:130px;object-fit:contain}
  .fiche h3{margin:0;font-size:1.05rem;color:var(--brun)}
  .fiche .date{font-size:.82rem;color:var(--ocre);font-weight:700}
  .fiche p{margin:4px 0 0;font-size:.93rem}
  .essentiel{background:#fff;border:1px solid var(--trait);border-radius:16px;padding:12px 14px;margin-bottom:10px;font-size:.95rem}
  .essentiel h3{margin:0 0 6px;font-size:1.05rem;color:var(--brun)}
  .essentiel ul{margin:0;padding-left:18px}
  .essentiel li{margin-bottom:4px}
</style>
</head>
<body>
<div class="wrap">

<!-- ================= ACCUEIL ================= -->
<section id="accueil">
  <a class="retour" href="index.html">‹ Mes révisions</a>
  <div class="tete">
    <h1>Les débuts de l'humanité</h1>
    <p>Histoire, thème 1 : qui sont les premiers hommes ?</p>
    <div class="defile" id="defile"></div>
    <div class="sens"><span>Plus ancien</span><span>Plus récent</span></div>
  </div>
  <div class="modes">
    <button class="mode" data-mode="lecon"><span class="ic">📖</span><div><b>La leçon en bref</b><span>Les 4 hominidés et l'essentiel à retenir</span></div></button>
    <button class="mode" data-mode="qui"><span class="ic">🔍</span><div><b>Qui est-ce ?</b><span>Reconnais l'hominidé sur l'image (8 questions)</span></div></button>
    <button class="mode" data-mode="frise"><span class="ic">⏳</span><div><b>La frise</b><span>Remets dans l'ordre chronologique (4 questions)</span></div></button>
    <button class="mode" data-mode="cours"><span class="ic">✏️</span><div><b>Le cours</b><span>Questions et textes à trous (10 questions)</span></div></button>
    <button class="mode ctrl" data-mode="controle"><span class="ic">🏆</span><div><b>Contrôle</b><span>Un peu de tout, 12 questions, meilleur score gardé</span></div></button>
  </div>
  <p class="record" id="record"></p>
</section>

<!-- ================= LEÇON ================= -->
<section id="lecon" class="hidden">
  <button class="quitter" id="l-retour">‹ Retour</button>
  <div id="l-contenu"></div>
  <div class="actions"><button class="btn" data-go="qui">Je m'entraîne à les reconnaître</button></div>
</section>

<!-- ================= QUESTION ================= -->
<section id="question" class="hidden">
  <div class="haut">
    <span class="compte" id="q-compte"></span>
    <div class="barre"><span id="q-barre"></span></div>
    <button class="quitter" id="q-quitter">Quitter</button>
  </div>
  <div class="panneau">
    <div class="theme" id="q-theme"></div>
    <p class="enonce" id="q-enonce"></p>
    <div id="q-zone"></div>
    <div id="q-retour"></div>
    <div class="actions"><button class="btn hidden" id="q-suivant">Suivant</button></div>
  </div>
</section>

<!-- ================= FIN ================= -->
<section id="fin" class="hidden">
  <div class="panneau fin">
    <div>Ton score</div>
    <div class="gros" id="f-score"></div>
    <p id="f-msg"></p>
    <p class="record" id="f-record"></p>
    <div id="f-erreurs"></div>
    <div class="actions">
      <button class="btn" id="f-encore">Recommencer</button>
      <button class="btn sec" id="f-menu">Menu</button>
    </div>
  </div>
</section>
</div>

<script>
"use strict";
/* ================== CONTENU DE LA LEÇON ================== */
var ESPECES = {
  austra: {nom:"Australopithèque", date:"vers −3 millions d'années (frise du cours)",
    info:"Petit (autour d'un mètre), poilu, avec de longs bras. Il marche debout mais grimpe encore aux arbres. La plus célèbre s'appelle Lucy.",

  habilis:{nom:"Homo habilis", date:"vers −2 millions d'années (frise du cours)",

  erectus:{nom:"Homo erectus", date:"après Homo habilis",

  sapiens:{nom:"Homo sapiens", date:"le plus récent",

    indice:"Grand, droit, front haut et visage comme le nôtre : c'est Homo sapiens, notre espèce."}
};
var ORDRE = ["austra","habilis","erectus","sapiens"];

  {k:"austra", src:"a3_austra"}, {k:"austra", src:"a5_afar"}, {k:"austra", src:"a5_afri"}, {k:"austra", src:"a4_lucy", note:"Reconstitution de musée."},

/* ================== OUTILS ================== */
function $(id){ return document.getElementById(id); }
function melange(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function prendre(a,n){ return melange(a).slice(0,n); }
function unDe(a){ return a[Math.floor(Math.random()*a.length)]; }
function img(src){ return '<img src="'+IMG[src]+'" alt="">'; }

/* ====== Enregistrement du meilleur score (lu par la page d'accueil) ====== */
function enregistrerMeilleurScore(bon, total){
  try{
    var lien = location.pathname.split("/").pop() || "index.html";
    var cle = "meilleur:" + lien;
    var prev = null;
    try { prev = JSON.parse(localStorage.getItem(cle)); } catch(e){}
    var mieux = !prev || (bon/total) > (prev.bon/prev.total) ||
                ((bon/total) === (prev.bon/prev.total) && bon > prev.bon);
    if(mieux) localStorage.setItem(cle, JSON.stringify({bon:bon, total:total}));
    return meilleurConnu();
  }catch(e){ return null; }
}
function meilleurConnu(){
  try{
    var lien = location.pathname.split("/").pop() || "index.html";
    return JSON.parse(localStorage.getItem("meilleur:" + lien));
  }catch(e){ return null; }
}

/* ================== GÉNÉRATEURS DE QUESTIONS ================== */
/* QCM : {type:'qcm', theme, enonce, photo?, options:[{t, ok}], explain} */
function qcm(o){ o.type='qcm'; o.options=melange(o.options); return o; }

function qQuiEstCe(im){
  var e=ESPECES[im.k];
  return qcm({theme:"Qui est-ce ?", enonce:"Quel hominidé est représenté ?", photo:im.src,
    options:ORDRE.map(function(k){ return {t:ESPECES[k].nom, ok:k===im.k}; }),
    explain:e.indice+(im.note?" "+im.note:""), bonne:e.nom});
}
function qPrimate(){
  return qcm({theme:"Qui est-ce ?", enonce:"Ce primate est-il un hominidé ?", photo:"a3_primate",
    options:[
      {t:"Non : il se déplace surtout à quatre pattes", ok:true},
      {t:"Oui : il a des mains comme nous"},
      {t:"Oui : tous les primates sont des hominidés"},
      {t:"Non : il est trop poilu"}],
    explain:"Dans ta définition, un hominidé se tient le plus souvent debout et marche sur ses deux pieds. Attention : l'homme ne descend pas des singes d'aujourd'hui. Ils ont un ancêtre commun très ancien.",
    bonne:"Non, car il marche surtout à quatre pattes"});
}

var COURS = [
  function(){ return qcm({theme:"La Préhistoire", enonce:"La Préhistoire commence avec…",
    options:[{t:"l'apparition des premiers hommes",ok:true},{t:"l'invention de l'écriture"},{t:"l'apparition des dinosaures"},{t:"les débuts de l'agriculture"}],
    explain:"La Préhistoire commence avec l'apparition des premiers hommes. Les dinosaures avaient disparu bien avant, il y a environ 66 millions d'années.",
    bonne:"l'apparition des premiers hommes"}); },
  function(){ return qcm({theme:"La Préhistoire", enonce:"La Préhistoire se termine avec…",
    options:[{t:"l'invention de l'écriture",ok:true},{t:"la maîtrise du feu"},{t:"les débuts de l'agriculture"},{t:"les peintures de Lascaux"}],
    explain:"Quand l'écriture apparaît, on passe de la Préhistoire à l'Histoire.", bonne:"l'invention de l'écriture"}); },
  function(){ return qcm({theme:"La frise", enonce:"D'après la frise du cours, l'écriture apparaît vers…",
    options:[{t:"−3 000",ok:true},{t:"−8 000"},{t:"−50 000"},{t:"−3 millions"}],
    explain:"Sur la frise : l'écriture vers −3 000, c'est la fin de la Préhistoire.", bonne:"−3 000"}); },
  function(){ return qcm({theme:"La frise", enonce:"D'après la frise, qu'est-ce qui marque le début du Néolithique ?",
    options:[{t:"L'agriculture",ok:true},{t:"L'écriture"},{t:"La maîtrise du feu"},{t:"Les peintures de Lascaux"}],
    explain:"Le Néolithique commence avec l'agriculture (vers −8 000 sur la frise).", bonne:"L'agriculture"}); },
  function(){ return qcm({theme:"La frise", enonce:"Les peintures de la grotte de Lascaux datent de quelle période ?",
    options:[{t:"Le Paléolithique",ok:true},{t:"Le Néolithique"},{t:"L'Antiquité"},{t:"Le Moyen Âge"}],
    explain:"Sur la frise, Lascaux est avant l'agriculture : c'est donc le Paléolithique.", bonne:"Le Paléolithique"}); },
  function(){ return qcm({theme:"La frise", enonce:"Quelle est la période la plus longue de la Préhistoire ?",
    options:[{t:"Le Paléolithique",ok:true},{t:"Le Néolithique"}],
    explain:"Le Paléolithique dure des millions d'années. Le Néolithique ne dure que quelques milliers d'années.", bonne:"Le Paléolithique"}); },
  function(){ return qcm({theme:"Toumaï", enonce:"Toumaï, le plus ancien hominidé découvert, a vécu il y a environ…",
    options:[{t:"7 millions d'années",ok:true},{t:"7 milliards d'années"},{t:"7 000 ans"},{t:"700 000 ans"}],
    explain:"Des millions, pas des milliards ! 7 milliards d'années, ce serait plus vieux que la Terre elle-même, qui a environ 4,5 milliards d'années.",
    bonne:"7 millions d'années"}); },
  function(){ return qcm({theme:"Toumaï", enonce:"Dans quel pays a-t-on découvert Toumaï ?",
    options:[{t:"Au Tchad, en Afrique",ok:true},{t:"En France"},{t:"En Chine"},{t:"En Égypte"}],
    explain:"Toumaï a été découvert au Tchad, en Afrique.", bonne:"Au Tchad"}); },
  function(){ return qcm({theme:"Les premiers hommes", enonce:"Où vivaient les premiers hommes ?",
    options:[{t:"En Afrique de l'Est",ok:true},{t:"En Europe"},{t:"En Amérique"},{t:"En Asie"}],
    explain:"Les premiers hommes sont apparus en Afrique de l'Est.", bonne:"En Afrique de l'Est"}); },
  function(){ return qcm({theme:"Vocabulaire", enonce:"Qu'est-ce qu'un hominidé ?",
    options:[{t:"Un primate qui se tient le plus souvent debout et marche sur ses deux pieds",ok:true},
             {t:"Un singe qui vit dans les arbres"},{t:"Un homme qui sait écrire"},{t:"Un animal disparu avec les dinosaures"}],
    explain:"Hominidé : groupe de mammifères primates qui se tient le plus souvent debout et marche sur ses deux pieds.",
    bonne:"Un primate qui se tient debout et marche sur deux pieds"}); },
  function(){ return qcm({theme:"Vocabulaire", enonce:"Toumaï serait bipède. Cela veut dire qu'il…",
    options:[{t:"marchait sur deux pieds",ok:true},{t:"avait deux bras"},{t:"vivait en groupe de deux"},{t:"savait faire du feu"}],
    explain:"Bi = deux, pède = pied. Un bipède marche sur deux pieds.", bonne:"marchait sur deux pieds"}); },
  function(){ return qcm({theme:"Les premiers hommes", enonce:"Quel est le premier représentant du genre « Homo » ?",
    options:[{t:"Homo habilis",ok:true},{t:"Homo erectus"},{t:"Homo sapiens"},{t:"Toumaï"}],
    explain:"Homo habilis est le premier du genre Homo. Viennent ensuite Homo erectus, puis Homo sapiens.", bonne:"Homo habilis"}); },
  function(){ return qcm({theme:"Les premiers hommes", enonce:"À quelle espèce appartiennent tous les humains d'aujourd'hui ?",
    options:[{t:"Homo sapiens",ok:true},{t:"Homo habilis"},{t:"Homo erectus"},{t:"Australopithèque"}],
    explain:"Nous sommes tous des Homo sapiens.", bonne:"Homo sapiens"}); },
  function(){ var k=unDe(["habilis","erectus","sapiens"]);
    var sens={habilis:"l'homme habile",erectus:"l'homme debout",sapiens:"l'homme sage"};
    return qcm({theme:"Vocabulaire", enonce:"Que veut dire le nom « Homo "+k+" » ?",
    options:["habilis","erectus","sapiens"].map(function(x){ return {t:sens[x], ok:x===k}; }).concat([{t:"l'homme du feu"}]),
    explain:"Homo habilis = l'homme habile. Homo erectus = l'homme debout. Homo sapiens = l'homme sage.", bonne:sens[k]}); },
  function(){ return qcm({theme:"Les premiers hommes", enonce:"Parmi ces hominidés, lequel maîtrise le feu ?",
    options:[{t:"Homo erectus",ok:true},{t:"L'australopithèque"},{t:"Toumaï"}],
    explain:"Homo erectus maîtrise le feu (vers −500 000 sur la frise).", bonne:"Homo erectus"}); }
];

/* Textes à trous : [texte, ...] avec {mot} pour chaque trou, + intrus */
var TROUS = [
  {t:"La Préhistoire commence avec l'apparition des premiers {hommes} et se termine avec l'invention de {l'écriture}. Toumaï, le plus ancien {hominidé} découvert, a été trouvé au {Tchad}.",
   intrus:["l'agriculture","dinosaures","Maroc","singe"]},
  {t:"Un hominidé est un {primate} qui se tient le plus souvent {debout} et marche sur ses deux {pieds}. Les premiers hommes vivaient en Afrique de l'{Est}.",
   intrus:["mains","Ouest","poisson","assis"]},
  {t:"Le premier représentant du genre Homo est Homo {habilis}. Puis vient Homo {erectus}, qui maîtrise le {feu}. Aujourd'hui, nous sommes tous des Homo {sapiens}.",
   intrus:["écriture","Lucy","australopithèque"]}
];
function qTrous(d){
  var mots=[], morceaux=d.t.split(/\{([^}]+)\}/);
  for(var i=1;i<morceaux.length;i+=2) mots.push(morceaux[i]);
  return {type:'trous', theme:"Texte à trous", enonce:"Complète le texte avec les bonnes étiquettes.",
    morceaux:morceaux, mots:mots, banque:melange(mots.concat(d.intrus))};
}

/* Frise : {type:'ordre', items:[{html, cle, nom}] dans l'ordre correct} */
function qOrdrePhotos(){
  var items=ORDRE.map(function(k){
    var im=unDe(IMAGES.filter(function(x){ return x.k===k && x.src!=="a4_lucy"; }));
    return {html:img(im.src), nom:ESPECES[k].nom};
  });
  return {type:'ordre', photos:true, theme:"La frise", enonce:"Touche les hominidés du plus ancien au plus récent.", items:items};
}
var EVENEMENTS = [
  {nom:"Toumaï"},{nom:"Les australopithèques"},{nom:"La maîtrise du feu"},
  {nom:"Les peintures de Lascaux"},{nom:"Les débuts de l'agriculture"},{nom:"L'invention de l'écriture"}
];
function qOrdreEvenements(){
  var idx=prendre([0,1,2,3,4,5],4).sort(function(a,b){return a-b;});
  return {type:'ordre', theme:"La frise", enonce:"Range ces événements du plus ancien au plus récent.",
    items:idx.map(function(i){ return {html:EVENEMENTS[i].nom, nom:EVENEMENTS[i].nom}; })};
}
function qOrdreNoms(){
  var noms=["Toumaï","Australopithèque","Homo habilis","Homo erectus","Homo sapiens"];
  return {type:'ordre', theme:"La frise", enonce:"Range ces hominidés du plus ancien au plus récent.",
    items:noms.map(function(n){ return {html:n, nom:n}; })};
}

/* ================== SÉRIES ================== */
function serie(mode){
  var ims=prendre(IMAGES,10);
  if(mode==='qui'){
    var s=ims.slice(0,7).map(qQuiEstCe); s.push(qPrimate()); return melange(s);
  }
  if(mode==='frise') return [qOrdrePhotos(), qOrdreEvenements(), qOrdreNoms(), qOrdrePhotos()];
  if(mode==='cours'){
    var c=prendre(COURS,8).map(function(f){ return f(); });
    prendre(TROUS,2).forEach(function(d){ c.splice(2+Math.floor(Math.random()*7),0,qTrous(d)); });
    return c;
  }
  /* contrôle */
  var q=ims.slice(0,4).map(qQuiEstCe)
    .concat([qOrdrePhotos(), qOrdreEvenements(), qTrous(unDe(TROUS))])
    .concat(prendre(COURS,5).map(function(f){ return f(); }));
  return melange(q);
}

/* ================== DÉROULEMENT ================== */
var etat={};
function montrer(id){ ["accueil","lecon","question","fin"].forEach(function(s){ $(s).classList.toggle('hidden', s!==id); }); window.scrollTo(0,0); }

function demarrer(mode){
  if(mode==='lecon'){ afficherLecon(); return; }
  etat={mode:mode, serie:serie(mode), i:0, score:0, erreurs:[]};
  question(); montrer('question');
}

function question(){
  var q=etat.serie[etat.i], n=etat.serie.length;
  etat.repondu=false;
  $('q-compte').textContent=(etat.i+1)+" / "+n;
  $('q-barre').style.width=(etat.i/n*100)+"%";
  $('q-theme').textContent=q.theme;
  $('q-enonce').textContent=q.enonce;
  $('q-retour').innerHTML="";
  $('q-suivant').classList.add('hidden');
  var z=$('q-zone');
  if(q.type==='qcm') rendreQcm(q,z);
  else if(q.type==='ordre') rendreOrdre(q,z);
  else rendreTrous(q,z);
}

function repondre(ok, texte, resume, correction){
  if(etat.repondu) return;
  etat.repondu=true;
  if(ok) etat.score++;
  else etat.erreurs.push({q:resume, c:correction});
  $('q-retour').innerHTML='<div class="retour-q '+(ok?'ok':'ko')+'"><b>'+(ok?'Bravo !':'Pas tout à fait.')+'</b>'+(texte||'')+'</div>';
  var b=$('q-suivant'); b.textContent = etat.i+1<etat.serie.length ? "Suivant" : "Voir mon score";
  b.classList.remove('hidden');
  b.scrollIntoView({behavior:'smooth', block:'nearest'});
}

function rendreQcm(q,z){
  var h='';
  if(q.photo) h+='<div class="photo">'+img(q.photo)+'</div>';
  h+='<div class="opts">'+q.options.map(function(o,i){ return '<button class="opt" data-i="'+i+'">'+o.t+'</button>'; }).join('')+'</div>';
  z.innerHTML=h;
  z.querySelectorAll('.opt').forEach(function(b){
    b.onclick=function(){
      if(etat.repondu) return;
      var o=q.options[+b.dataset.i];
      z.querySelectorAll('.opt').forEach(function(x){ x.disabled=true; if(q.options[+x.dataset.i].ok) x.classList.add('bon'); });
      if(!o.ok) b.classList.add('faux');
      repondre(!!o.ok, q.explain, q.enonce+(q.photo?" (image)":""), q.bonne);
    };
  });
}

function rendreOrdre(q,z){
  var n=q.items.length;
  var aff=melange(q.items.map(function(it,i){ return {it:it, rang:i}; }));
  var choix=[];
  z.innerHTML='<p class="aide">Touche une case pour la numéroter. Touche-la à nouveau pour annuler.</p>'+
    '<div class="tuiles'+(q.photos?' photos':'')+'">'+aff.map(function(a,i){ return '<button class="tuile" data-i="'+i+'">'+a.it.html+'</button>'; }).join('')+'</div>'+
    '<div class="actions"><button class="btn" id="o-val" disabled>Valider</button></div>';
  var tuiles=z.querySelectorAll('.tuile');
  function maj(){
    tuiles.forEach(function(t,i){
      var p=choix.indexOf(i), old=t.querySelector('.num'); if(old) old.remove();
      t.classList.toggle('choisie', p>=0);
      if(p>=0){ var s=document.createElement('span'); s.className='num'; s.textContent=p+1; t.appendChild(s); }
    });
    $('o-val').disabled = choix.length!==n;
  }
  tuiles.forEach(function(t,i){
    t.onclick=function(){
      if(etat.repondu) return;
      var p=choix.indexOf(i);
      if(p>=0) choix.splice(p,1); else choix.push(i);
      maj();
    };
  });
  $('o-val').onclick=function(){
    if(etat.repondu) return;
    var ok=true;
    choix.forEach(function(ti,pos){ var bon=aff[ti].rang===pos; if(!bon) ok=false; tuiles[ti].classList.add(bon?'bon':'faux'); });
    tuiles.forEach(function(t,i){ t.disabled=true; if(q.photos){ var s=document.createElement('span'); s.className='nomsol'; s.textContent=aff[i].it.nom; t.appendChild(s); } });
    $('o-val').disabled=true;
    var bonOrdre=q.items.map(function(it){ return it.nom; });
    var txt = ok ? "C'est le bon ordre." : '<div class="solution">Le bon ordre :<ol>'+bonOrdre.map(function(x){return '<li>'+x+'</li>';}).join('')+'</ol></div>';
    repondre(ok, txt, q.enonce, bonOrdre.join(" → "));
  };
}

function rendreTrous(q,z){
  var nb=q.mots.length, rempli=new Array(nb).fill(null), actif=0;
  var h='<div class="texte">';
  for(var i=0;i<q.morceaux.length;i++){
    if(i%2===0) h+=q.morceaux[i];
    else h+='<button class="trou" data-t="'+((i-1)/2)+'">&nbsp;</button>';
  }
  h+='</div><div class="banque">'+q.banque.map(function(m,i){ return '<button class="etiq" data-b="'+i+'">'+m+'</button>'; }).join('')+'</div>'+
     '<div class="actions"><button class="btn" id="t-val" disabled>Valider</button></div>';
  z.innerHTML=h;
  var trous=z.querySelectorAll('.trou'), etiqs=z.querySelectorAll('.etiq');
  function maj(){
    trous.forEach(function(t,i){
      t.innerHTML = rempli[i]===null ? '&nbsp;' : q.banque[rempli[i]];
      t.classList.toggle('rempli', rempli[i]!==null);
      t.classList.toggle('actif', i===actif && !etat.repondu);
    });
    etiqs.forEach(function(e,i){ e.disabled = rempli.indexOf(i)>=0 || etat.repondu; });
    $('t-val').disabled = rempli.indexOf(null)>=0 || etat.repondu;
  }
  trous.forEach(function(t,i){
    t.onclick=function(){ if(etat.repondu) return; if(rempli[i]!==null){ rempli[i]=null; } actif=i; maj(); };
  });
  etiqs.forEach(function(e,i){
    e.onclick=function(){
      if(etat.repondu) return;
      if(rempli[actif]!==null){ var libre=rempli.indexOf(null); if(libre<0) return; actif=libre; }
      rempli[actif]=i;
      var suivant=rempli.indexOf(null); actif = suivant<0 ? actif : suivant;
      maj();
    };
  });
  $('t-val').onclick=function(){
    if(etat.repondu) return;
    var ok=true;
    trous.forEach(function(t,i){
      var mot=q.banque[rempli[i]], bon= mot===q.mots[i];
      if(!bon){ ok=false; t.innerHTML='<s>'+mot+'</s> <small>'+q.mots[i]+'</small>'; }
      t.classList.add(bon?'bon':'faux'); t.classList.remove('actif');
    });
    etiqs.forEach(function(e){ e.disabled=true; });
    $('t-val').disabled=true;
    var corrige=q.morceaux.map(function(m,i){ return i%2 ? '<b>'+m+'</b>' : m; }).join('');
    repondre(ok, ok ? "Tous les mots sont bien placés." : "La correction est en vert dans le texte.", "Texte à trous", corrige);
  };
  maj();
}

function terminer(){
  var n=etat.serie.length, s=etat.score, r=s/n;
  $('f-score').textContent=s+" / "+n;
  $('f-msg').textContent = r===1 ? "Sans faute, bravo !" : r>=.75 ? "Très bien, encore un petit effort." : r>=.5 ? "C'est en bonne voie. Relis les corrections puis recommence." : "Relis la leçon en bref, puis recommence : les questions changeront.";
  if(etat.mode==='controle'){ var b=enregistrerMeilleurScore(s,n); $('f-record').textContent = b ? "Meilleur score au contrôle : "+b.bon+" / "+b.total : ""; }
  else $('f-record').textContent="";
  var e=$('f-erreurs');
  e.innerHTML = etat.erreurs.length
    ? '<h3>À revoir</h3><ul class="erreurs">'+etat.erreurs.map(function(x){ return '<li>'+x.q+'<span>'+x.c+'</span></li>'; }).join('')+'</ul>'
    : '';
  montrer('fin');
}

function afficherLecon(){
  var h='';
  ORDRE.forEach(function(k){
    var e=ESPECES[k], im=IMAGES.filter(function(x){ return x.k===k && x.src.indexOf('a3_')===0; })[0];
    h+='<div class="fiche">'+img(im.src)+'<div><h3>'+e.nom+'</h3><div class="date">'+e.date+'</div><p>'+e.info+'</p></div></div>';
  });
  h+='<div class="essentiel"><h3>À retenir</h3><ul>'+
    '<li>La <b>Préhistoire</b> commence avec l\'apparition des premiers hommes et se termine avec l\'invention de l\'<b>écriture</b> (vers −3 000).</li>'+
    '<li>Les premiers hommes vivaient en <b>Afrique de l\'Est</b>.</li>'+
    '<li><b>Toumaï</b> est le plus ancien hominidé découvert : il a vécu il y a environ <b>7 millions</b> d\'années, au <b>Tchad</b>. Il serait bipède.</li>'+
    '<li><b>Hominidé</b> : groupe de mammifères primates qui se tient le plus souvent debout et marche sur ses deux pieds.</li>'+
    '<li>Ordre : Toumaï, australopithèque, Homo habilis, Homo erectus, Homo sapiens. Nous sommes des <b>Homo sapiens</b>.</li>'+
    '<li><b>Paléolithique</b> : maîtrise du feu, peintures de Lascaux. <b>Néolithique</b> : commence avec l\'agriculture (vers −8 000).</li>'+
    '</ul></div>';
  $('l-contenu').innerHTML=h;
  montrer('lecon');
}

function majAccueil(){
  var b=meilleurConnu();
  $('record').textContent = b ? "Meilleur score au contrôle : "+b.bon+" / "+b.total : "";
}

$('defile').innerHTML=ORDRE.map(function(k){ return img({austra:"a5_afar",habilis:"a5_habilis",erectus:"a5_erectus",sapiens:"a5_sapiens"}[k]); }).join('');
document.querySelectorAll('.mode').forEach(function(b){ b.onclick=function(){ demarrer(b.dataset.mode); }; });
document.querySelectorAll('[data-go]').forEach(function(b){ b.onclick=function(){ demarrer(b.dataset.go); }; });
$('l-retour').onclick=function(){ montrer('accueil'); };
$('q-suivant').onclick=function(){ etat.i++; if(etat.i>=etat.serie.length) terminer(); else { question(); window.scrollTo(0,0); } };
$('q-quitter').onclick=function(){ majAccueil(); montrer('accueil'); };
$('f-encore').onclick=function(){ demarrer(etat.mode); };
$('f-menu').onclick=function(){ majAccueil(); montrer('accueil'); };
majAccueil();
</script>
